name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mcp:
    name: Standard and MCP server (parser, compiler, fixture execution, Ossie export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gasp-wiki-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gasp-wiki-mcp/package-lock.json
      # The upstream Apache Ossie validator (ossie-validator/) runs under uv.
      - uses: astral-sh/setup-uv@v5
      # The upstream expression grammar (ossie-validator/core-spec/grammar/) is generated with the ANTLR tool, which needs Java; without it the grammar tests skip.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Keeps the ANTLR jar the grammar tests download from Maven Central between runs, so a refused download does not fail the suite. After npm ci, which empties node_modules.
      - uses: actions/cache@v4
        with:
          path: gasp-wiki-mcp/node_modules/.cache/antlr
          key: antlr-jar-${{ hashFiles('gasp-wiki-mcp/test/ossie-grammar.py') }}
      - run: npm run build
      # Writes build/standard-data.json and standard-version.json, which two bundle tests read.
      - run: npm run export-data
      - name: Derived files are current
        run: npm run derive:check
      - run: npm test
