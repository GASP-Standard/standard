[project]
name = "gasp-ossie-validator"
version = "0.1.0"
description = "Checks the GASP payloads in an Apache Ossie document against the GASP extension schema, as a vendor validator for validation/validate.py --vendor GASP"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.26.0"]

[project.urls]
Repository = "https://github.com/GASP-Standard/standard"
Schema = "https://gaspwiki.com/schemas/gasp-ossie-extension-v1.json"

# The hook in apache/ossie validation/validate.py (#697): the entry point name is
# the vendor token in extensions/vendors.md, matched exactly.
[project.entry-points."ossie.vendor_validators"]
GASP = "gasp_ossie_validator:check"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gasp_ossie_validator"]

# uv rebuilds a local package only when a cache key changes; the module and the
# schema copy are part of it, so an edit to either is never served from the cache.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*" }]
