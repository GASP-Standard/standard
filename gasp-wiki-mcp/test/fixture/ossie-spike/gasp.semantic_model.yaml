version: 0.2.0.dev0
name: GASP reference model
description: >
  Spike subset of the GASP SaaS reference model: the CEL datasets Net Revenue
  Retention reads, one staged cohort dataset, and the canonical NRR metrics in
  both forms.
datasets:
- name: customer
  source: gasp.customer_snapshot
  description: Daily snapshot of every customer
  primary_key: [customer_id, snapshot_date]
  fields:
  - name: customer_id
    expression: { dialects: [ { dialect: OSSIE_SQL_2026, expression: customer_id } ] }
    datatype: String
  - name: snapshot_date
    expression: { dialects: [ { dialect: OSSIE_SQL_2026, expression: snapshot_date } ] }
    datatype: Date
    dimension: { is_time: true }
  - name: customer_status
    expression: { dialects: [ { dialect: OSSIE_SQL_2026, expression: customer_status } ] }
    datatype: String
    ai_context:
      instructions: "One of trial, active, churned, dormant"
- name: subscription
  source: gasp.subscription_snapshot
  description: Daily snapshot of every subscription
  primary_key: [subscription_id, snapshot_date]
  fields:
  - name: subscription_id
    expression: { dialects: [ { dialect: OSSIE_SQL_2026, expression: subscription_id } ] }
    datatype: String
  - name: customer_id
    expression: { dialects: [ { dialect: OSSIE_SQL_2026, expression: customer_id } ] }
    datatype: String
  - name: snapshot_date
    expression: { dialects: [ { dialect: OSSIE_SQL_2026, expression: snapshot_date } ] }
    datatype: Date
    dimension: { is_time: true }
  - name: subscription_status
    expression: { dialects: [ { dialect: OSSIE_SQL_2026, expression: subscription_status } ] }
    datatype: String
  - name: mrr
    expression: { dialects: [ { dialect: OSSIE_SQL_2026, expression: mrr } ] }
    datatype: Decimal
- name: revenue_event
  source: gasp.revenue_event
  description: CEL Revenue_Event ledger
  primary_key: [event_id]
  fields:
  - name: event_id
    expression: { dialects: [ { dialect: OSSIE_SQL_2026, expression: event_id } ] }
    datatype: String
  - name: customer_id
    expression: { dialects: [ { dialect: OSSIE_SQL_2026, expression: customer_id } ] }
    datatype: String
  - name: event_date
    expression: { dialects: [ { dialect: OSSIE_SQL_2026, expression: event_date } ] }
    datatype: Date
    dimension: { is_time: true }
  - name: event_type
    expression: { dialects: [ { dialect: OSSIE_SQL_2026, expression: event_type } ] }
    datatype: String
  - name: mrr_change
    expression: { dialects: [ { dialect: OSSIE_SQL_2026, expression: mrr_change } ] }
    datatype: Decimal
  - name: expansion_classification
    expression: { dialects: [ { dialect: OSSIE_SQL_2026, expression: expansion_classification } ] }
    datatype: String
- name: gasp_account_cohorts
  description: >
    Staged dataset: one row per customer active at the start of a trailing twelve
    month window, with its MRR at the start and at the end. Generated by GASP from
    the subscription snapshot so that cohort metrics are plain aggregates.
  source: >
    SELECT s0.customer_id, s0.snapshot_date AS period_start, s1.snapshot_date AS period_end,
           SUM(s0.mrr) AS mrr_start, COALESCE(SUM(s1.mrr), 0) AS mrr_end
    FROM gasp.subscription_snapshot s0
    LEFT JOIN gasp.subscription_snapshot s1
      ON s1.customer_id = s0.customer_id AND s1.subscription_status = 'active'
     AND s1.snapshot_date = s0.snapshot_date + INTERVAL '12 month'
    WHERE s0.subscription_status = 'active'
    GROUP BY s0.customer_id, s0.snapshot_date, s1.snapshot_date
  primary_key: [customer_id, period_start]
  fields:
  - name: customer_id
    expression: { dialects: [ { dialect: OSSIE_SQL_2026, expression: customer_id } ] }
    datatype: String
  - name: period_start
    expression: { dialects: [ { dialect: OSSIE_SQL_2026, expression: period_start } ] }
    datatype: Date
    dimension: { is_time: true }
  - name: period_end
    expression: { dialects: [ { dialect: OSSIE_SQL_2026, expression: period_end } ] }
    datatype: Date
  - name: mrr_start
    expression: { dialects: [ { dialect: OSSIE_SQL_2026, expression: mrr_start } ] }
    datatype: Decimal
  - name: mrr_end
    expression: { dialects: [ { dialect: OSSIE_SQL_2026, expression: mrr_end } ] }
    datatype: Decimal
  custom_extensions:
  - vendor_name: GASP
    data: '{"staged": true, "source_datasets": ["subscription"], "window": "12 month"}'
relationships:
- name: subscription_customer
  from: subscription
  to: customer
  from_columns: [customer_id, snapshot_date]
  to_columns: [customer_id, snapshot_date]
- name: revenue_event_customer
  from: revenue_event
  to: customer
  from_columns: [customer_id, event_date]
  to_columns: [customer_id, snapshot_date]
- name: cohort_customer
  from: gasp_account_cohorts
  to: customer
  from_columns: [customer_id, period_start]
  to_columns: [customer_id, snapshot_date]
metrics:
- name: gasp_expansion_mrr
  description: Expansion MRR, GASP canonical definition
  datatype: Decimal
  expression:
    dialects:
    - dialect: OSSIE_SQL_2026
      expression: SUM(CASE WHEN revenue_event.event_type = 'expansion' THEN revenue_event.mrr_change ELSE 0 END)
  ai_context:
    synonyms: ["upsell MRR"]
    instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/core#expansion-mrr"
  custom_extensions:
  - vendor_name: GASP
    data: '{"gasp_id":"expansion_mrr","gasp_version":"1","unit":"currency","formula":"sum(field.mrr_change where field.event_type = ''expansion'')"}'
- name: gasp_nrr_o
  description: Net Revenue Retention, Operating form, GASP canonical definition
  datatype: Decimal
  expression:
    dialects:
    - dialect: OSSIE_SQL_2026
      expression: SUM(gasp_account_cohorts.mrr_end) / SUM(gasp_account_cohorts.mrr_start)
  ai_context:
    synonyms: ["net dollar retention", "NDR", "NRR-O"]
    instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/core#net-revenue-retention-nrr. Operating form counts same_product and usage_realisation expansion only."
  custom_extensions:
  - vendor_name: GASP
    data: '{"gasp_id":"nrr","gasp_version":"1","form":"O","unit":"percent","staged_from":"gasp_account_cohorts"}'
- name: gasp_nrr_m
  description: Net Revenue Retention, Market form, GASP canonical definition
  datatype: Decimal
  expression:
    dialects:
    - dialect: OSSIE_SQL_2026
      expression: SUM(gasp_account_cohorts.mrr_end) / SUM(gasp_account_cohorts.mrr_start)
  ai_context:
    synonyms: ["net dollar retention", "NDR", "NRR-M"]
    instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/core#net-revenue-retention-nrr. Market form counts every expansion classification plus reactivation of cohort customers."
  custom_extensions:
  - vendor_name: GASP
    data: '{"gasp_id":"nrr","gasp_version":"1","form":"M","unit":"percent","staged_from":"gasp_account_cohorts"}'
