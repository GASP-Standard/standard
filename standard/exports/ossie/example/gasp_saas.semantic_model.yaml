metrics:
  - name: gasp_mrr
    expression:
      sql: COALESCE(SUM(subscription.mrr) FILTER (WHERE subscription.subscription_status = 'active'), 0)
    description: MRR (Monthly Recurring Revenue). The total predictable revenue from active subscriptions, normalised to a monthly value.
    datatype: Decimal
    ai_context:
      synonyms:
        - MRR
      instructions: "Canonical definition: https://koinedata.com/v1/metrics/core/mrr-monthly-recurring-revenue. Reads the subscription snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    nonportable_extensions:
      - vendor_name: GASP
        data:
          gasp_id: mrr
          gasp_version: "1"
          unit: currency
          formula: sum(field.mrr where field.subscription_status = 'active') at period_end
  - name: gasp_arr
    expression:
      sql: ((COALESCE(SUM(subscription.mrr) FILTER (WHERE subscription.subscription_status = 'active'), 0)) * 12)
    description: ARR (Annual Recurring Revenue). The annualised value of recurring revenue. ARR represents the yearly run rate of subscription revenue.
    datatype: Decimal
    ai_context:
      synonyms:
        - ARR
      instructions: "Canonical definition: https://koinedata.com/v1/metrics/core/arr-annual-recurring-revenue. Reads the subscription snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    nonportable_extensions:
      - vendor_name: GASP
        data:
          gasp_id: arr
          gasp_version: "1"
          unit: currency
          formula: metric.mrr * 12
  - name: gasp_arr_o
    expression:
      sql: SUM(gasp_staged_gasp_arr_o.value)
    description: ARR (Annual Recurring Revenue), Operating form. The annualised value of recurring revenue. ARR represents the yearly run rate of subscription revenue.
    datatype: Decimal
    ai_context:
      synonyms:
        - ARR
      instructions: "Canonical definition: https://koinedata.com/v1/metrics/core/arr-annual-recurring-revenue. Staged (cohort): gasp_staged_gasp_arr_o holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    nonportable_extensions:
      - vendor_name: GASP
        data:
          gasp_id: arr
          gasp_version: "1"
          form: O
          unit: currency
          formula: (metric.mrr - window(sum(field.mrr_change where field.expansion_classification in ('pricing_adjustment', 'recontracting')), 12 month)) * 12 over cohort(field.customer_id, period_end)
          staged: true
  - name: gasp_arr_m
    expression:
      sql: ((COALESCE(SUM(subscription.mrr) FILTER (WHERE subscription.subscription_status = 'active'), 0)) * 12)
    description: ARR (Annual Recurring Revenue), Market form. The annualised value of recurring revenue. ARR represents the yearly run rate of subscription revenue.
    datatype: Decimal
    ai_context:
      synonyms:
        - ARR
      instructions: "Canonical definition: https://koinedata.com/v1/metrics/core/arr-annual-recurring-revenue. Reads the subscription snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    nonportable_extensions:
      - vendor_name: GASP
        data:
          gasp_id: arr
          gasp_version: "1"
          form: M
          unit: currency
          formula: metric.mrr * 12
  - name: gasp_arpa
    expression:
      sql: (CAST((COALESCE(SUM(subscription.mrr) FILTER (WHERE subscription.subscription_status = 'active'), 0)) AS DECIMAL) / NULLIF((COUNT(DISTINCT customer.customer_id) FILTER (WHERE customer.customer_status = 'active')), 0))
    description: ARPA (Average Revenue Per Account). Average monthly recurring revenue per customer.
    datatype: Decimal
    ai_context:
      synonyms:
        - ARPA
      instructions: "Canonical definition: https://koinedata.com/v1/metrics/core/arpa-average-revenue-per-account. Reads the customer and subscription snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    nonportable_extensions:
      - vendor_name: GASP
        data:
          gasp_id: arpa
          gasp_version: "1"
          unit: currency
          formula: metric.mrr / metric.total_customers
  - name: gasp_total_customers
    expression:
      sql: COUNT(DISTINCT customer.customer_id) FILTER (WHERE customer.customer_status = 'active')
    description: Total Customers. The number of active customers at the end of the period.
    datatype: Integer
    ai_context:
      instructions: "Canonical definition: https://koinedata.com/v1/metrics/core/total-customers. Reads the customer snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    nonportable_extensions:
      - vendor_name: GASP
        data:
          gasp_id: total_customers
          gasp_version: "1"
          unit: count
          formula: count_distinct(field.customer_id where field.customer_status = 'active') at period_end
  - name: gasp_new_customers
    expression:
      sql: COUNT(DISTINCT revenue_event.customer_id) FILTER (WHERE revenue_event.event_type = 'new')
    description: "New Customers. The number of customers acquired in the period: customers whose first paid subscription started in the period."
    datatype: Integer
    ai_context:
      instructions: "Canonical definition: https://koinedata.com/v1/metrics/core/new-customers."
    nonportable_extensions:
      - vendor_name: GASP
        data:
          gasp_id: new_customers
          gasp_version: "1"
          unit: count
          formula: count_distinct(field.customer_id where field.event_type = 'new')
  - name: gasp_churned_customers
    expression:
      sql: COUNT(DISTINCT revenue_event.customer_id) FILTER (WHERE revenue_event.event_type = 'churn')
    description: "Churned Customers. The number of customers lost in the period: customers whose last active subscription ended."
    datatype: Integer
    ai_context:
      instructions: "Canonical definition: https://koinedata.com/v1/metrics/core/churned-customers."
    nonportable_extensions:
      - vendor_name: GASP
        data:
          gasp_id: churned_customers
          gasp_version: "1"
          unit: count
          formula: count_distinct(field.customer_id where field.event_type = 'churn')
  - name: gasp_mrr_growth_rate
    expression:
      sql: SUM(gasp_staged_gasp_mrr_growth_rate.value)
    description: MRR Growth Rate. The month-over-month percentage change in MRR.
    datatype: Decimal
    ai_context:
      synonyms:
        - MRR
      instructions: "Canonical definition: https://koinedata.com/v1/metrics/core/mrr-growth-rate. Staged (lag): gasp_staged_gasp_mrr_growth_rate holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    nonportable_extensions:
      - vendor_name: GASP
        data:
          gasp_id: mrr_growth_rate
          gasp_version: "1"
          unit: percent
          formula: (metric.mrr - lag(metric.mrr, 1 month)) / lag(metric.mrr, 1 month)
          staged: true
  - name: gasp_new_mrr
    expression:
      sql: COALESCE(SUM(revenue_event.mrr_change) FILTER (WHERE revenue_event.event_type = 'new'), 0)
    description: New MRR. MRR generated from brand new customers acquired in the period.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://koinedata.com/v1/metrics/core/new-mrr."
    nonportable_extensions:
      - vendor_name: GASP
        data:
          gasp_id: new_mrr
          gasp_version: "1"
          unit: currency
          formula: sum(field.mrr_change where field.event_type = 'new')
  - name: gasp_expansion_mrr
    expression:
      sql: COALESCE(SUM(revenue_event.mrr_change) FILTER (WHERE revenue_event.event_type = 'expansion'), 0)
    description: Expansion MRR. Additional MRR from existing customers through upgrades, add-ons, seat increases or price increases.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://koinedata.com/v1/metrics/core/expansion-mrr."
    nonportable_extensions:
      - vendor_name: GASP
        data:
          gasp_id: expansion_mrr
          gasp_version: "1"
          unit: currency
          formula: sum(field.mrr_change where field.event_type = 'expansion')
  - name: gasp_churned_mrr
    expression:
      sql: (-COALESCE(SUM(revenue_event.mrr_change) FILTER (WHERE revenue_event.event_type = 'churn'), 0))
    description: Churned MRR. MRR lost from customers who cancelled their subscriptions.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://koinedata.com/v1/metrics/core/churned-mrr."
    nonportable_extensions:
      - vendor_name: GASP
        data:
          gasp_id: churned_mrr
          gasp_version: "1"
          unit: currency
          formula: -sum(field.mrr_change where field.event_type = 'churn')
  - name: gasp_contraction_mrr
    expression:
      sql: (-COALESCE(SUM(revenue_event.mrr_change) FILTER (WHERE revenue_event.event_type = 'contraction'), 0))
    description: Contraction MRR. MRR reduction from existing customers who downgraded but didn't churn.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://koinedata.com/v1/metrics/core/contraction-mrr."
    nonportable_extensions:
      - vendor_name: GASP
        data:
          gasp_id: contraction_mrr
          gasp_version: "1"
          unit: currency
          formula: -sum(field.mrr_change where field.event_type = 'contraction')
  - name: gasp_reactivation_mrr
    expression:
      sql: COALESCE(SUM(revenue_event.mrr_change) FILTER (WHERE revenue_event.event_type = 'reactivation'), 0)
    description: Reactivation MRR. MRR regained from customers who had churned and signed up again in the period.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://koinedata.com/v1/metrics/core/reactivation-mrr."
    nonportable_extensions:
      - vendor_name: GASP
        data:
          gasp_id: reactivation_mrr
          gasp_version: "1"
          unit: currency
          formula: sum(field.mrr_change where field.event_type = 'reactivation')
  - name: gasp_carry_mrr
    expression:
      sql: SUM(gasp_staged_gasp_carry_mrr.value)
    description: "Carry MRR. The part of beginning MRR that existing customers kept paying in the period: beginning MRR less churned and contraction MRR, before any expansion."
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://koinedata.com/v1/metrics/core/carry-mrr. Staged (at period_start): gasp_staged_gasp_carry_mrr holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    nonportable_extensions:
      - vendor_name: GASP
        data:
          gasp_id: carry_mrr
          gasp_version: "1"
          unit: currency
          formula: metric.mrr at period_start - metric.churned_mrr - metric.contraction_mrr
          staged: true
  - name: gasp_net_new_mrr
    expression:
      sql: (((((COALESCE(SUM(revenue_event.mrr_change) FILTER (WHERE revenue_event.event_type = 'new'), 0)) + (COALESCE(SUM(revenue_event.mrr_change) FILTER (WHERE revenue_event.event_type = 'expansion'), 0))) + (COALESCE(SUM(revenue_event.mrr_change) FILTER (WHERE revenue_event.event_type = 'reactivation'), 0))) - ((-COALESCE(SUM(revenue_event.mrr_change) FILTER (WHERE revenue_event.event_type = 'churn'), 0)))) - ((-COALESCE(SUM(revenue_event.mrr_change) FILTER (WHERE revenue_event.event_type = 'contraction'), 0))))
    description: Net New MRR. The net change in MRR after accounting for all movements.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://koinedata.com/v1/metrics/core/net-new-mrr."
    nonportable_extensions:
      - vendor_name: GASP
        data:
          gasp_id: net_new_mrr
          gasp_version: "1"
          unit: currency
          formula: metric.new_mrr + metric.expansion_mrr + metric.reactivation_mrr - metric.churned_mrr - metric.contraction_mrr
  - name: gasp_nrr
    expression:
      sql: SUM(gasp_staged_gasp_nrr.value)
    description: Net Revenue Retention (NRR). The percentage of revenue retained from existing customers over a period, including expansion, contraction and churn. Also known as Net Dollar Retention (NDR).
    datatype: Decimal
    ai_context:
      synonyms:
        - NRR
        - NDR
      instructions: "Canonical definition: https://koinedata.com/v1/metrics/core/net-revenue-retention-nrr. Staged (cohort): gasp_staged_gasp_nrr holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    nonportable_extensions:
      - vendor_name: GASP
        data:
          gasp_id: nrr
          gasp_version: "1"
          unit: percent
          formula: (metric.mrr at period_start + metric.expansion_mrr - metric.contraction_mrr - metric.churned_mrr) / metric.mrr at period_start over cohort(field.customer_id, period_start)
          staged: true
  - name: gasp_nrr_o
    expression:
      sql: SUM(gasp_staged_gasp_nrr_o.value)
    description: Net Revenue Retention (NRR), Operating form. The percentage of revenue retained from existing customers over a period, including expansion, contraction and churn. Also known as Net Dollar Retention (NDR).
    datatype: Decimal
    ai_context:
      synonyms:
        - NRR
        - NDR
      instructions: "Canonical definition: https://koinedata.com/v1/metrics/core/net-revenue-retention-nrr. Staged (cohort): gasp_staged_gasp_nrr_o holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    nonportable_extensions:
      - vendor_name: GASP
        data:
          gasp_id: nrr
          gasp_version: "1"
          form: O
