  - name: gasp_rule_of_40
    expression:
      sql: SUM(gasp_staged_gasp_rule_of_40.value)
    description: Rule of 40. A heuristic that balances growth and profitability. A healthy SaaS company's growth rate plus profit margin should equal 40% or more.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://koinedata.com/v1/metrics/core/rule-of-40. Staged (lag): gasp_staged_gasp_rule_of_40 holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
