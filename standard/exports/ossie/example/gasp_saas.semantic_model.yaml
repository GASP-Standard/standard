# Generated from the GASP Standard (https://koinedata.com) by `npm run derive` in gasp-wiki-mcp. Do not edit; edit /standard/ and re-run.
version: 0.3.0.dev0
name: GASP SaaS core
description: "The Core metrics of the GASP Standard (Generally Accepted SaaS Principles) as an Apache Ossie semantic model: 39 metrics over 6 datasets, cut from the full reference model at https://koinedata.com/downloads/ossie/. Each metric carries its canonical page and its GASP formula."
datasets:
  - name: revenue_event
    source: gasp.revenue_event
    description: "Revenue event. Kind: event. CEL class: Revenue_Event."
    primary_key:
      - event_id
    fields:
      - name: change_nature
        expression:
          sql: change_nature
        description: permanent, temporary or scheduled_reversal (Adjusted NRR/GRR)
        datatype: String
        ai_context:
          instructions: One of permanent, temporary, scheduled_reversal
      - name: currency
        expression:
          sql: currency
        description: ISO 4217 currency code
        datatype: String
      - name: customer_id
        expression:
          sql: customer_id
        description: Customer (account) identifier. Primary business noun; CEL name
        datatype: String
      - name: event_date
        expression:
          sql: event_date
        dimension:
          is_time: true
        description: Date the event occurred
        datatype: Date
      - name: event_id
        expression:
          sql: event_id
        description: Unique, immutable event identifier
        datatype: String
      - name: event_type
        expression:
          sql: event_type
        description: Revenue movement classifier (CEL Revenue_Event.event_type)
        datatype: String
        ai_context:
          instructions: One of new, expansion, contraction, churn, reactivation, renewal
      - name: expansion_classification
        expression:
          sql: expansion_classification
        description: ATL expansion tag; read by ARR-O, NRR-O and NRR-M
        datatype: String
        ai_context:
          instructions: One of same_product, new_module, new_buying_centre, pricing_adjustment, recontracting, usage_realisation
      - name: lifecycle_attribution
        expression:
          sql: lifecycle_attribution
        description: ATL lifecycle tag
        datatype: String
        ai_context:
          instructions: One of acquisition, activation, retention, expansion, reactivation, servicing
      - name: mrr_change
        expression:
          sql: mrr_change
        description: Change in MRR; negative for contraction and churn
        datatype: Decimal
      - name: new_mrr
        expression:
          sql: new_mrr
        description: MRR after the event
        datatype: Decimal
      - name: prior_mrr
        expression:
          sql: prior_mrr
        description: MRR before the event
        datatype: Decimal
      - name: segment
        expression:
          sql: segment
        description: Customer segment (SMB, Mid-Market, Enterprise or the organisation's own scheme) at the time of the event or snapshot. The field behind the Segment concept; carried on revenue tables so retention and movement metrics slice by it without a join.
        datatype: String
      - name: subscription_id
        expression:
          sql: subscription_id
        description: Subscription identifier
        datatype: String
    nonportable_extensions:
      - vendor_name: GASP
        data:
          kind: event
          cel: Revenue_Event
  - name: cost_event
    source: gasp.cost_event
    description: "Cost event. Kind: event. CEL class: Cost_Event."
    primary_key:
      - event_id
    fields:
      - name: cost
        expression:
          sql: cost
        description: Cost amount (CEL Cost_Event.amount)
        datatype: Decimal
      - name: cost_centre
        expression:
          sql: cost_centre
        description: Department or team that incurred the cost
        datatype: String
        ai_context:
          instructions: One of marketing, sales, customer_success, support, engineering, product, finance, people, services, partnerships, general
      - name: cost_function
        expression:
          sql: cost_function
        description: Purpose of cost (ATL cost function, extended to all cost events)
        datatype: String
        ai_context:
          instructions: One of gtm, implementation, onboarding, infrastructure, support, success_engineering, account_management, research_development, general_administrative, services_delivery, recruiting, partner_program, partner_commission
      - name: cost_type
        expression:
          sql: cost_type
        description: Nature of cost (CEL)
        datatype: String
        ai_context:
          instructions: One of personnel, software, services, infrastructure, other
      - name: currency
        expression:
          sql: currency
        description: ISO 4217 currency code
        datatype: String
      - name: customer_id
        expression:
          sql: customer_id
        description: Customer (account) identifier. Primary business noun; CEL name
        datatype: String
      - name: event_date
        expression:
          sql: event_date
        dimension:
          is_time: true
        description: Date the event occurred
        datatype: Date
      - name: event_id
        expression:
          sql: event_id
        description: Unique, immutable event identifier
        datatype: String
      - name: lifecycle_attribution
        expression:
          sql: lifecycle_attribution
        description: ATL lifecycle tag
        datatype: String
        ai_context:
          instructions: One of acquisition, activation, retention, expansion, reactivation, servicing
      - name: partner_id
        expression:
          sql: partner_id
        description: Partner identifier
        datatype: String
      - name: project_id
        expression:
          sql: project_id
        description: Services project identifier; null on costs not attributable to a project
        datatype: String
    nonportable_extensions:
      - vendor_name: GASP
        data:
          kind: event
          cel: Cost_Event
  - name: customer
    source: gasp.customer
    description: "Customer. Kind: snapshot."
    primary_key:
      - customer_id
      - snapshot_date
    fields:
      - name: acquisition_date
        expression:
          sql: acquisition_date
        description: Date the customer first became paying
        datatype: Date
      - name: activation_date
        expression:
          sql: activation_date
        description: Date the activation milestone was reached
        datatype: Date
      - name: composite_score
        expression:
          sql: composite_score
        description: Health score on a 0 to 100 scale
        datatype: Decimal
      - name: criteria_met
        expression:
          sql: criteria_met
        description: Product-qualified criteria met
        datatype: Boolean
      - name: csm_id
        expression:
          sql: csm_id
        description: Assigned customer success manager
        datatype: String
      - name: customer_id
        expression:
          sql: customer_id
        description: Customer (account) identifier. Primary business noun; CEL name
        datatype: String
      - name: customer_status
        expression:
          sql: customer_status
        description: Customer lifecycle status; active means at least one active subscription
        datatype: String
        ai_context:
          instructions: One of trial, active, churned, dormant
      - name: last_active_date
        expression:
          sql: last_active_date
        description: Most recent qualifying activity
        datatype: Date
      - name: onboarding_completion_date
        expression:
          sql: onboarding_completion_date
        description: Onboarding completion; null while open
        datatype: Date
      - name: qbr_completed
        expression:
          sql: qbr_completed
        description: A QBR was held in the period
        datatype: Boolean
      - name: qbr_due
        expression:
          sql: qbr_due
        description: A QBR was due in the period
        datatype: Boolean
      - name: segment
        expression:
          sql: segment
        description: Customer segment (SMB, Mid-Market, Enterprise or the organisation's own scheme) at the time of the event or snapshot. The field behind the Segment concept; carried on revenue tables so retention and movement metrics slice by it without a join.
        datatype: String
      - name: snapshot_date
        expression:
          sql: snapshot_date
        dimension:
          is_time: true
        description: As-of date of the snapshot row
        datatype: Date
      - name: upgrade_eligible
        expression:
          sql: upgrade_eligible
        description: Customer is on a plan with an upgrade path
        datatype: Boolean
    nonportable_extensions:
      - vendor_name: GASP
        data:
          kind: snapshot
          activeWhen: field.customer_status = 'active'
  - name: subscription
    source: gasp.subscription
    description: "Subscription. Kind: snapshot."
    primary_key:
      - subscription_id
      - snapshot_date
    fields:
      - name: auto_renewed
        expression:
          sql: auto_renewed
        description: Renewal happened without manual intervention
        datatype: Boolean
      - name: contract_end
        expression:
          sql: contract_end
        description: Contract end date
        datatype: Date
      - name: contract_start
        expression:
          sql: contract_start
        description: Contract start date
        datatype: Date
      - name: customer_id
        expression:
          sql: customer_id
        description: Customer (account) identifier. Primary business noun; CEL name
        datatype: String
      - name: forecast_renewal_amount
        expression:
          sql: forecast_renewal_amount
        description: Forecast renewal value
        datatype: Decimal
      - name: plan_id
        expression:
          sql: plan_id
        description: Pricing plan identifier; the plan a subscription is priced by
        datatype: String
      - name: mrr
        expression:
          sql: mrr
        description: Monthly recurring revenue of the subscription
        datatype: Decimal
      - name: mrr_end
        expression:
          sql: mrr_end
        description: MRR at period end (cohort form)
        datatype: Decimal
      - name: mrr_start
        expression:
          sql: mrr_start
        description: MRR at period start (cohort form)
        datatype: Decimal
      - name: renewal_amount
        expression:
          sql: renewal_amount
        description: Value up for renewal
        datatype: Decimal
      - name: renewal_complete_date
        expression:
          sql: renewal_complete_date
        description: Date renewal processing finished
        datatype: Date
      - name: renewal_notified_on_time
        expression:
          sql: renewal_notified_on_time
        description: Renewal notice sent within the agreed window
        datatype: Boolean
      - name: renewal_trigger_date
        expression:
          sql: renewal_trigger_date
        description: Date renewal processing started
        datatype: Date
      - name: renewed
        expression:
          sql: renewed
        description: Renewed at the most recent term end
        datatype: Boolean
      - name: segment
        expression:
          sql: segment
        description: Customer segment (SMB, Mid-Market, Enterprise or the organisation's own scheme) at the time of the event or snapshot. The field behind the Segment concept; carried on revenue tables so retention and movement metrics slice by it without a join.
        datatype: String
      - name: snapshot_date
        expression:
          sql: snapshot_date
        dimension:
          is_time: true
        description: As-of date of the snapshot row
        datatype: Date
      - name: subscription_id
        expression:
          sql: subscription_id
        description: Subscription identifier
        datatype: String
      - name: subscription_status
        expression:
          sql: subscription_status
        description: Subscription status
        datatype: String
        ai_context:
          instructions: One of active, cancelled, expired, paused
    nonportable_extensions:
      - vendor_name: GASP
        data:
          kind: snapshot
          activeWhen: field.subscription_status = 'active'
  - name: survey_response
    source: gasp.survey_response
    description: "Survey response. Kind: event."
    primary_key:
      - response_id
    fields:
      - name: ces_score
        expression:
          sql: ces_score
        description: 1 to 7 effort score
        datatype: Integer
      - name: customer_id
        expression:
          sql: customer_id
        description: Customer (account) identifier. Primary business noun; CEL name
        datatype: String
      - name: employee_id
        expression:
          sql: employee_id
        description: Employee identifier
        datatype: String
      - name: engagement_score
        expression:
          sql: engagement_score
        description: Engagement survey score
        datatype: Decimal
      - name: lead_id
        expression:
          sql: lead_id
        description: Lead identifier
        datatype: String
      - name: nps_score
        expression:
          sql: nps_score
        description: 0 to 10 recommend score
        datatype: Integer
      - name: partner_id
        expression:
          sql: partner_id
        description: Partner identifier
        datatype: String
      - name: project_id
        expression:
          sql: project_id
        description: Services project identifier; null on costs not attributable to a project
        datatype: String
      - name: response_id
        expression:
          sql: response_id
        description: Survey response identifier
        datatype: String
      - name: satisfaction_score
        expression:
          sql: satisfaction_score
        description: 1 to 5 satisfaction score
        datatype: Integer
      - name: survey_completed
        expression:
          sql: survey_completed
        description: Response completed
        datatype: Boolean
      - name: survey_date
        expression:
          sql: survey_date
        dimension:
          is_time: true
        description: Response date
        datatype: Date
      - name: survey_type
        expression:
          sql: survey_type
        description: Survey programme the response belongs to
        datatype: String
        ai_context:
          instructions: One of customer, onboarding, project, partner, employee, prospect
    nonportable_extensions:
      - vendor_name: GASP
        data:
          kind: event
  - name: financials
    source: gasp.financials
    description: "Income statement and cash flow. Kind: fact."
    primary_key:
      - period_start
    fields:
      - name: bad_debt_expense
        expression:
          sql: bad_debt_expense
        description: Bad debt written off in the period
        datatype: Decimal
      - name: capital_expenditures
        expression:
          sql: capital_expenditures
        description: Capital expenditure for the period
        datatype: Decimal
      - name: ebitda
        expression:
          sql: ebitda
        description: EBITDA for the period
        datatype: Decimal
      - name: net_income
        expression:
          sql: net_income
        description: Net income for the period
        datatype: Decimal
      - name: operating_cash_flow
        expression:
          sql: operating_cash_flow
        description: Operating cash flow for the period
        datatype: Decimal
      - name: period_start
        expression:
          sql: period_start
        dimension:
          is_time: true
        description: Start of the period the row describes
        datatype: Date
      - name: revenue
        expression:
          sql: revenue
        description: GAAP recognised revenue for the period
        datatype: Decimal
      - name: revenue_type
        expression:
          sql: revenue_type
        description: Revenue line type
        datatype: String
        ai_context:
          instructions: One of subscription, services, usage, other
    nonportable_extensions:
      - vendor_name: GASP
        data:
          kind: fact
  - name: gasp_staged_gasp_arr_o
    source: SELECT p.period_start, p.period_end, (((((SELECT COALESCE(SUM(mrr), 0) FROM gasp.subscription WHERE snapshot_date = p.period_end AND subscription_status = 'active' AND customer_id IN (SELECT customer_id FROM gasp.customer WHERE snapshot_date = p.period_end AND customer_status = 'active'))) - (SELECT COALESCE(SUM(mrr_change), 0) FROM gasp.revenue_event WHERE event_date >= ((p.period_end + INTERVAL '1 day') - INTERVAL '12 month') AND event_date <= p.period_end AND expansion_classification IN ('pricing_adjustment', 'recontracting') AND customer_id IN (SELECT customer_id FROM gasp.customer WHERE snapshot_date = p.period_end AND customer_status = 'active'))) * 12)) AS value FROM gasp.period_spine p
    description: "Staged dataset for gasp_arr_o: one row per reporting period holding the metric value, computed by the GASP compiled query (needs cohort, window)."
    primary_key:
      - period_start
    fields:
      - name: period_start
        expression:
          sql: period_start
        dimension:
          is_time: true
        datatype: Date
        description: First day of the reporting period
      - name: period_end
        expression:
          sql: period_end
        datatype: Date
        description: Last day of the reporting period
      - name: value
        expression:
          sql: value
        datatype: Decimal
        description: ARR (Annual Recurring Revenue), Operating form for the period
    nonportable_extensions:
      - vendor_name: GASP
        data:
          staged: true
          for: gasp_arr_o
          reason: cohort
          source_dialect: POSTGRES
          sources:
            SNOWFLAKE: SELECT p.period_start, p.period_end, (((((SELECT COALESCE(SUM(mrr), 0) FROM gasp.subscription WHERE snapshot_date = p.period_end AND subscription_status = 'active' AND customer_id IN (SELECT customer_id FROM gasp.customer WHERE snapshot_date = p.period_end AND customer_status = 'active'))) - (SELECT COALESCE(SUM(mrr_change), 0) FROM gasp.revenue_event WHERE event_date >= DATEADD(month, -12, DATEADD(day, 1, p.period_end)) AND event_date <= p.period_end AND expansion_classification IN ('pricing_adjustment', 'recontracting') AND customer_id IN (SELECT customer_id FROM gasp.customer WHERE snapshot_date = p.period_end AND customer_status = 'active'))) * 12)) AS value FROM gasp.period_spine p
            BIGQUERY: SELECT p.period_start, p.period_end, (((((SELECT COALESCE(SUM(mrr), 0) FROM gasp.subscription WHERE snapshot_date = p.period_end AND subscription_status = 'active' AND customer_id IN (SELECT customer_id FROM gasp.customer WHERE snapshot_date = p.period_end AND customer_status = 'active'))) - (SELECT COALESCE(SUM(mrr_change), 0) FROM gasp.revenue_event WHERE event_date >= DATE_SUB(DATE_ADD(p.period_end, INTERVAL 1 DAY), INTERVAL 12 MONTH) AND event_date <= p.period_end AND expansion_classification IN ('pricing_adjustment', 'recontracting') AND customer_id IN (SELECT customer_id FROM gasp.customer WHERE snapshot_date = p.period_end AND customer_status = 'active'))) * 12)) AS value FROM gasp.period_spine p
            DATABRICKS: SELECT p.period_start, p.period_end, (((((SELECT COALESCE(SUM(mrr), 0) FROM gasp.subscription WHERE snapshot_date = p.period_end AND subscription_status = 'active' AND customer_id IN (SELECT customer_id FROM gasp.customer WHERE snapshot_date = p.period_end AND customer_status = 'active'))) - (SELECT COALESCE(SUM(mrr_change), 0) FROM gasp.revenue_event WHERE event_date >= DATEADD(MONTH, -12, DATEADD(DAY, 1, p.period_end)) AND event_date <= p.period_end AND expansion_classification IN ('pricing_adjustment', 'recontracting') AND customer_id IN (SELECT customer_id FROM gasp.customer WHERE snapshot_date = p.period_end AND customer_status = 'active'))) * 12)) AS value FROM gasp.period_spine p
  - name: gasp_staged_gasp_mrr_growth_rate
    source: SELECT p.period_start, p.period_end, ((CAST((((SELECT COALESCE(SUM(mrr), 0) FROM gasp.subscription WHERE snapshot_date = p.period_end AND subscription_status = 'active')) - ((SELECT COALESCE(SUM(mrr), 0) FROM gasp.subscription WHERE snapshot_date = (((p.period_end + INTERVAL '1 day') - INTERVAL '1 month') - INTERVAL '1 day') AND subscription_status = 'active'))) AS DOUBLE PRECISION) / NULLIF(((SELECT COALESCE(SUM(mrr), 0) FROM gasp.subscription WHERE snapshot_date = (((p.period_end + INTERVAL '1 day') - INTERVAL '1 month') - INTERVAL '1 day') AND subscription_status = 'active')), 0))) AS value FROM gasp.period_spine p
    description: "Staged dataset for gasp_mrr_growth_rate: one row per reporting period holding the metric value, computed by the GASP compiled query (needs lag)."
    primary_key:
      - period_start
    fields:
      - name: period_start
        expression:
          sql: period_start
        dimension:
          is_time: true
        datatype: Date
        description: First day of the reporting period
      - name: period_end
        expression:
          sql: period_end
        datatype: Date
        description: Last day of the reporting period
      - name: value
        expression:
          sql: value
        datatype: Decimal
        description: MRR Growth Rate for the period
    nonportable_extensions:
      - vendor_name: GASP
        data:
          staged: true
          for: gasp_mrr_growth_rate
          reason: lag
          source_dialect: POSTGRES
          sources:
            SNOWFLAKE: SELECT p.period_start, p.period_end, ((CAST((((SELECT COALESCE(SUM(mrr), 0) FROM gasp.subscription WHERE snapshot_date = p.period_end AND subscription_status = 'active')) - ((SELECT COALESCE(SUM(mrr), 0) FROM gasp.subscription WHERE snapshot_date = DATEADD(day, -1, DATEADD(month, -1, DATEADD(day, 1, p.period_end))) AND subscription_status = 'active'))) AS DOUBLE) / NULLIF(((SELECT COALESCE(SUM(mrr), 0) FROM gasp.subscription WHERE snapshot_date = DATEADD(day, -1, DATEADD(month, -1, DATEADD(day, 1, p.period_end))) AND subscription_status = 'active')), 0))) AS value FROM gasp.period_spine p
            BIGQUERY: SELECT p.period_start, p.period_end, ((CAST((((SELECT COALESCE(SUM(mrr), 0) FROM gasp.subscription WHERE snapshot_date = p.period_end AND subscription_status = 'active')) - ((SELECT COALESCE(SUM(mrr), 0) FROM gasp.subscription WHERE snapshot_date = DATE_SUB(DATE_SUB(DATE_ADD(p.period_end, INTERVAL 1 DAY), INTERVAL 1 MONTH), INTERVAL 1 DAY) AND subscription_status = 'active'))) AS FLOAT64) / NULLIF(((SELECT COALESCE(SUM(mrr), 0) FROM gasp.subscription WHERE snapshot_date = DATE_SUB(DATE_SUB(DATE_ADD(p.period_end, INTERVAL 1 DAY), INTERVAL 1 MONTH), INTERVAL 1 DAY) AND subscription_status = 'active')), 0))) AS value FROM gasp.period_spine p
            DATABRICKS: SELECT p.period_start, p.period_end, ((CAST((((SELECT COALESCE(SUM(mrr), 0) FROM gasp.subscription WHERE snapshot_date = p.period_end AND subscription_status = 'active')) - ((SELECT COALESCE(SUM(mrr), 0) FROM gasp.subscription WHERE snapshot_date = DATEADD(DAY, -1, DATEADD(MONTH, -1, DATEADD(DAY, 1, p.period_end))) AND subscription_status = 'active'))) AS DOUBLE) / NULLIF(((SELECT COALESCE(SUM(mrr), 0) FROM gasp.subscription WHERE snapshot_date = DATEADD(DAY, -1, DATEADD(MONTH, -1, DATEADD(DAY, 1, p.period_end))) AND subscription_status = 'active')), 0))) AS value FROM gasp.period_spine p
  - name: gasp_staged_gasp_carry_mrr
    source: SELECT p.period_start, p.period_end, (((((SELECT COALESCE(SUM(mrr), 0) FROM gasp.subscription WHERE snapshot_date = p.period_start AND subscription_status = 'active')) - ((-(SELECT COALESCE(SUM(mrr_change), 0) FROM gasp.revenue_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND event_type = 'churn')))) - ((-(SELECT COALESCE(SUM(mrr_change), 0) FROM gasp.revenue_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND event_type = 'contraction'))))) AS value FROM gasp.period_spine p
    description: "Staged dataset for gasp_carry_mrr: one row per reporting period holding the metric value, computed by the GASP compiled query (needs at period_start)."
    primary_key:
      - period_start
    fields:
      - name: period_start
        expression:
          sql: period_start
        dimension:
          is_time: true
        datatype: Date
        description: First day of the reporting period
      - name: period_end
        expression:
          sql: period_end
        datatype: Date
        description: Last day of the reporting period
      - name: value
        expression:
          sql: value
        datatype: Decimal
        description: Carry MRR for the period
    nonportable_extensions:
      - vendor_name: GASP
        data:
          staged: true
          for: gasp_carry_mrr
          reason: at period_start
          source_dialect: POSTGRES
          sources:
            SNOWFLAKE: SELECT p.period_start, p.period_end, (((((SELECT COALESCE(SUM(mrr), 0) FROM gasp.subscription WHERE snapshot_date = p.period_start AND subscription_status = 'active')) - ((-(SELECT COALESCE(SUM(mrr_change), 0) FROM gasp.revenue_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND event_type = 'churn')))) - ((-(SELECT COALESCE(SUM(mrr_change), 0) FROM gasp.revenue_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND event_type = 'contraction'))))) AS value FROM gasp.period_spine p
            BIGQUERY: SELECT p.period_start, p.period_end, (((((SELECT COALESCE(SUM(mrr), 0) FROM gasp.subscription WHERE snapshot_date = p.period_start AND subscription_status = 'active')) - ((-(SELECT COALESCE(SUM(mrr_change), 0) FROM gasp.revenue_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND event_type = 'churn')))) - ((-(SELECT COALESCE(SUM(mrr_change), 0) FROM gasp.revenue_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND event_type = 'contraction'))))) AS value FROM gasp.period_spine p
