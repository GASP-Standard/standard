      - SurveyType == 'customer' OR SurveyType == 'onboarding' OR SurveyType == 'project' OR SurveyType == 'partner' OR SurveyType == 'employee' OR SurveyType == 'prospect'
  - concept: UpgradeEligible
    type: ValueType
    description: Customer is on a plan with an upgrade path
    extends:
