# Generated from the GASP Standard (https://koinedata.com) by `npm run derive` in gasp-wiki-mcp. Do not edit; edit /standard/ and re-run.
version: 0.2.0.dev0
name: GASP SaaS core
description: "The concepts behind the Core metrics of the GASP Standard: 6 entity types (one per dataset the metrics read), their relationships and 46 value types, cut from the full GASP ontology at https://koinedata.com/downloads/ossie/."
ontology:
  - concept: RevenueEvent
    type: EntityType
    description: "Revenue event (event dataset `revenue_event`). CEL class: Revenue_Event."
    identify_by:
      - event_id
    relationships:
      - name: change_nature
        description: permanent, temporary or scheduled_reversal (Adjusted NRR/GRR)
        roles:
          - concept: ChangeNature
        multiplicity: ManyToOne
        verbalizes:
          - "{RevenueEvent} has {ChangeNature}"
      - name: currency
        description: ISO 4217 currency code
        roles:
          - concept: Currency
        multiplicity: ManyToOne
        verbalizes:
          - "{RevenueEvent} has {Currency}"
      - name: customer_id
        description: Customer (account) identifier. Primary business noun; CEL name
        roles:
          - concept: Customer
        multiplicity: ManyToOne
        verbalizes:
          - "{RevenueEvent} belongs to {Customer}"
      - name: event_date
        description: Date the event occurred
        roles:
          - concept: Date
        multiplicity: ManyToOne
        verbalizes:
          - "{RevenueEvent} has event date {Date}"
      - name: event_id
        description: Unique, immutable event identifier
        roles:
          - concept: EventId
        multiplicity: OneToOne
        verbalizes:
          - "{RevenueEvent} is identified by {EventId}"
      - name: event_type
        description: Revenue movement classifier (CEL Revenue_Event.event_type)
        roles:
          - concept: EventType
        multiplicity: ManyToOne
        verbalizes:
          - "{RevenueEvent} has {EventType}"
      - name: expansion_classification
        description: ATL expansion tag; required for NRR-M and ARR-M
        roles:
          - concept: ExpansionClassification
        multiplicity: ManyToOne
        verbalizes:
          - "{RevenueEvent} has {ExpansionClassification}"
      - name: lifecycle_attribution
        description: ATL lifecycle tag
        roles:
          - concept: LifecycleAttribution
        multiplicity: ManyToOne
        verbalizes:
          - "{RevenueEvent} has {LifecycleAttribution}"
      - name: mrr_change
        description: Change in MRR; negative for contraction and churn
        roles:
          - concept: MrrChange
        multiplicity: ManyToOne
        verbalizes:
          - "{RevenueEvent} has {MrrChange}"
      - name: new_mrr
        description: MRR after the event
        roles:
          - concept: NewMrr
        multiplicity: ManyToOne
        verbalizes:
          - "{RevenueEvent} has {NewMrr}"
      - name: prior_mrr
        description: MRR before the event
        roles:
          - concept: PriorMrr
        multiplicity: ManyToOne
        verbalizes:
          - "{RevenueEvent} has {PriorMrr}"
      - name: segment
        description: Customer segment (SMB, Mid-Market, Enterprise or the organisation's own scheme) at the time of the event or snapshot. The field behind the Segment concept; carried on revenue tables so retention and movement metrics slice by it without a join.
        roles:
          - concept: SegmentValue
        multiplicity: ManyToOne
        verbalizes:
          - "{RevenueEvent} has {SegmentValue}"
      - name: subscription_id
        description: Subscription identifier
        roles:
          - concept: Subscription
        multiplicity: ManyToOne
        verbalizes:
          - "{RevenueEvent} belongs to {Subscription}"
