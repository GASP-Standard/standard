        multiplicity: ManyToOne
        verbalizes:
          - "{Customer} on {Date} has acquisition date {Date:acquisition_date}"
      - name: activation_date
        description: Date the activation milestone was reached
        roles:
          - concept: Date
          - concept: Date
            name: activation_date
        multiplicity: ManyToOne
        verbalizes:
          - "{Customer} on {Date} has activation date {Date:activation_date}"
      - name: composite_score
        description: Health score on a 0 to 100 scale
        roles:
          - concept: Date
          - concept: CompositeScore
        multiplicity: ManyToOne
        verbalizes:
          - "{Customer} on {Date} has {CompositeScore}"
      - name: criteria_met
        description: Product-qualified criteria met
        roles:
          - concept: Date
          - concept: CriteriaMet
        multiplicity: ManyToOne
        verbalizes:
          - "{Customer} on {Date} has {CriteriaMet}"
      - name: csm_id
        description: Assigned customer success manager
        roles:
          - concept: Date
          - concept: CsmId
        multiplicity: ManyToOne
        verbalizes:
          - "{Customer} on {Date} has {CsmId}"
      - name: customer_id
        description: Customer (account) identifier. Primary business noun; CEL name
        roles:
          - concept: CustomerId
        multiplicity: OneToOne
        verbalizes:
          - "{Customer} is identified by {CustomerId}"
      - name: customer_status
        description: Customer lifecycle status; active means at least one active subscription
        roles:
          - concept: Date
          - concept: CustomerStatus
        multiplicity: ManyToOne
        verbalizes:
          - "{Customer} on {Date} has {CustomerStatus}"
      - name: last_active_date
        description: Most recent qualifying activity
        roles:
          - concept: Date
          - concept: Date
            name: last_active_date
        multiplicity: ManyToOne
        verbalizes:
          - "{Customer} on {Date} has last active date {Date:last_active_date}"
      - name: onboarding_completion_date
        description: Onboarding completion; null while open
        roles:
          - concept: Date
          - concept: Date
            name: onboarding_completion_date
        multiplicity: ManyToOne
        verbalizes:
          - "{Customer} on {Date} has onboarding completion date {Date:onboarding_completion_date}"
      - name: qbr_completed
        description: A QBR was held in the period
        roles:
          - concept: Date
          - concept: QbrCompleted
        multiplicity: ManyToOne
        verbalizes:
          - "{Customer} on {Date} has {QbrCompleted}"
      - name: qbr_due
        description: A QBR was due in the period
        roles:
          - concept: Date
          - concept: QbrDue
        multiplicity: ManyToOne
        verbalizes:
          - "{Customer} on {Date} has {QbrDue}"
      - name: segment
        description: Customer segment (SMB, Mid-Market, Enterprise or the organisation's own scheme) at the time of the event or snapshot. The field behind the Segment concept; carried on revenue tables so retention and movement metrics slice by it without a join.
        roles:
          - concept: Date
          - concept: SegmentValue
        multiplicity: ManyToOne
        verbalizes:
          - "{Customer} on {Date} has {SegmentValue}"
      - name: upgrade_eligible
        description: Customer is on a plan with an upgrade path
        roles:
          - concept: Date
          - concept: UpgradeEligible
        multiplicity: ManyToOne
        verbalizes:
          - "{Customer} on {Date} has {UpgradeEligible}"
      - name: owns
        description: "A customer holds one or more subscriptions. Hierarchy Principle 1: customers own subscriptions, not the reverse."
        roles:
          - concept: Subscription
        verbalizes:
          - "{Customer} owns {Subscription}"
      - name: parent_of
        description: Self-referential edge for account hierarchy. Global enterprises with subsidiaries roll up to a parent customer. Used for global account ARR and consolidated reporting.
        roles:
          - concept: Customer
            name: child
        verbalizes:
          - "{Customer} is parent of {Customer:child}"
  - concept: Subscription
    type: EntityType
    description: 'Subscription (snapshot dataset `subscription`). A billable agreement between a customer and your product, with defined terms, pricing, and status. The "what and when" of the relationship. Also known as: Contract, Agreement.'
