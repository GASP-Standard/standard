    type: EntityType
    description: Cohort. A time-bound grouping of customers by acquisition period. Used for retention and expansion analysis to isolate vintage effects.
  - concept: Pipeline
    type: EntityType
    description: Pipeline. The aggregate weighted value of active opportunities. Represents potential future bookings at various probability stages.
  - concept: Segment
    type: EntityType
    description: Segment. A classification of customers by size, vertical or fit (e.g. SMB, Mid-Market, Enterprise). Used for cohort analysis and benchmark comparison.
  - concept: Tcv
    type: EntityType
    description: TCV (Total Contract Value). The total value of a contract over its full term, including one-time fees and multi-year commitments. Distinct from Bookings (period-attributable) and ACV (annualized).
