        description: A QBR was held in the period
        roles:
          - concept: Date
          - concept: QbrCompleted
        multiplicity: ManyToOne
        verbalizes:
          - "{Customer} on {Date} has {QbrCompleted}"
      - name: qbr_due
        description: A QBR was due in the period
        roles:
          - concept: Date
          - concept: QbrDue
        multiplicity: ManyToOne
        verbalizes:
          - "{Customer} on {Date} has {QbrDue}"
      - name: tier
        description: Pricing tier or segment
        roles:
          - concept: Date
          - concept: Tier
        multiplicity: ManyToOne
        verbalizes:
          - "{Customer} on {Date} has {Tier}"
