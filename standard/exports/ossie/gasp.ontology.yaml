        description: "A customer holds one or more subscriptions. Hierarchy Principle 1: customers own subscriptions, not the reverse."
        roles:
          - concept: Subscription
        verbalizes:
          - "{Customer} owns {Subscription}"
      - name: engages_via
        description: In B2B SaaS, one customer organization has many product users. Usage and engagement metrics are measured at the user level.
        roles:
          - concept: User
        verbalizes:
          - "{Customer} engages via {User}"
      - name: submits
        description: Customers open support tickets. Support volume and resolution metrics are measured at the ticket level.
        roles:
          - concept: Ticket
        verbalizes:
          - "{Customer} submits {Ticket}"
      - name: belongs_to_cohort
        description: Each customer belongs to an acquisition cohort based on their start date. Cohort analysis isolates vintage effects in retention and expansion.
        roles:
          - concept: Cohort
        verbalizes:
          - "{Customer} belongs to {Cohort}"
      - name: parent_of
        description: Self-referential edge for account hierarchy. Global enterprises with subsidiaries roll up to a parent customer. Used for global account ARR and consolidated reporting.
        roles:
          - concept: Customer
            name: child
        verbalizes:
          - "{Customer} is parent of {Customer:child}"
      - name: belongs_to_segment
        description: Each customer belongs to a segment classification (SMB, Mid-Market, Enterprise) based on size, ARR or fit. Segment is the foundational lens for cohort and benchmark comparisons.
        roles:
          - concept: Segment
        verbalizes:
          - "{Customer} belongs to {Segment}"
