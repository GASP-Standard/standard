        data: "{\"gasp_id\":\"ttfv\",\"gasp_version\":\"1\",\"unit\":\"days\",\"formula\":\"median(field.milestone_date - field.contract_start where field.onboarding_milestone = 'first_value')\"}"
  - name: gasp_time_to_go_live
