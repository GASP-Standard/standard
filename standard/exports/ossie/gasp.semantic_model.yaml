  - name: gasp_services_pipeline
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(CASE WHEN (opportunity.revenue_type = 'services' AND opportunity.opportunity_stage NOT IN ('closed_won', 'closed_lost')) THEN opportunity.opportunity_amount ELSE 0 END)
    description: Services Pipeline. Value of services opportunities in pipeline.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/services-pipeline. Reads the opportunity snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"services_pipeline\",\"gasp_version\":\"1\",\"unit\":\"currency\",\"formula\":\"sum(field.opportunity_amount where field.revenue_type = 'services' and field.opportunity_stage not in ('closed_won', 'closed_lost')) at period_end\"}"
  - name: gasp_services_win_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_services_win_rate.value)
    description: Services Win Rate. Percentage of services opportunities won.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/services-win-rate. Staged (period bound in filter): gasp_staged_gasp_services_win_rate holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"services_win_rate\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"count_distinct(field.opportunity_id where field.revenue_type = 'services' and field.opportunity_stage = 'closed_won' and in_period(field.close_date)) / count_distinct(field.opportunity_id where field.revenue_type = 'services' and field.opportunity_stage in ('closed_won', 'closed_lost') and in_period(field.close_date))\",\"staged\":true}"
  - name: gasp_time_to_start
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_time_to_start.value)
    description: Time to Start. Time from services sold to project kickoff.
