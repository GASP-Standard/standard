      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/partnerships/marketplace-revenue. Staged (period bound in filter): gasp_staged_gasp_marketplace_revenue holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"marketplace_revenue\",\"gasp_version\":\"1\",\"unit\":\"currency\",\"formula\":\"sum(field.opportunity_amount where field.channel = 'referral' and field.partner_sourced = true and field.opportunity_stage = 'closed_won' and in_period(field.close_date))\",\"staged\":true}"
  - name: gasp_marketplace_as_of_revenue
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_marketplace_as_of_revenue.value)
    description: Marketplace as % of Revenue. Marketplace contribution to total revenue.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/partnerships/marketplace-as-of-revenue. Staged (period bound in filter): gasp_staged_gasp_marketplace_as_of_revenue holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"marketplace_as_of_revenue","gasp_version":"1","unit":"percent","formula":"metric.marketplace_revenue / metric.revenue_gaap","staged":true}'
  - name: gasp_pipeline_value
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(CASE WHEN opportunity.opportunity_stage NOT IN ('closed_won', 'closed_lost') THEN (opportunity.opportunity_amount * opportunity.stage_probability) ELSE 0 END)
    description: Pipeline Value. Total value of all active sales opportunities.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/sales/pipeline-value. Reads the opportunity snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"pipeline_value\",\"gasp_version\":\"1\",\"unit\":\"currency\",\"formula\":\"sum(field.opportunity_amount * field.stage_probability where field.opportunity_stage not in ('closed_won', 'closed_lost'))\"}"
  - name: gasp_pipeline_value_unweighted
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(CASE WHEN opportunity.opportunity_stage NOT IN ('closed_won', 'closed_lost') THEN opportunity.opportunity_amount ELSE 0 END)
    description: Pipeline Value, unweighted variant. Total value of all active sales opportunities.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/sales/pipeline-value. Reads the opportunity snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"pipeline_value\",\"gasp_version\":\"1\",\"variant\":\"unweighted\",\"unit\":\"currency\",\"formula\":\"sum(field.opportunity_amount where field.opportunity_stage not in ('closed_won', 'closed_lost'))\"}"
  - name: gasp_pipeline_coverage
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(SUM(CASE WHEN opportunity.opportunity_stage NOT IN ('closed_won', 'closed_lost') THEN opportunity.opportunity_amount ELSE 0 END) AS DECIMAL) / NULLIF(SUM(sales_rep.quota), 0))
    description: Pipeline Coverage Ratio. The ratio of unweighted pipeline value to quota for the period.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/sales/pipeline-coverage-ratio. Reads the opportunity snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"pipeline_coverage\",\"gasp_version\":\"1\",\"unit\":\"ratio\",\"formula\":\"sum(field.opportunity_amount where field.opportunity_stage not in ('closed_won', 'closed_lost')) / sum(field.quota)\"}"
  - name: gasp_pipeline_velocity
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_pipeline_velocity.value)
    description: Pipeline Velocity. The speed at which pipeline converts to revenue. Also called Sales Velocity or Deal Velocity.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/sales/pipeline-velocity. Staged (period bound in filter): gasp_staged_gasp_pipeline_velocity holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"pipeline_velocity\",\"gasp_version\":\"1\",\"unit\":\"currency\",\"formula\":\"count(field.opportunity_id where field.opportunity_stage not in ('closed_won', 'closed_lost')) * metric.win_rate * metric.average_deal_size / metric.sales_cycle\",\"staged\":true}"
  - name: gasp_win_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_win_rate.value)
    description: Win Rate. The percentage of qualified opportunities that close as won.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/sales/win-rate. Staged (period bound in filter): gasp_staged_gasp_win_rate holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"win_rate\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"count(field.opportunity_id where field.opportunity_stage = 'closed_won' and in_period(field.close_date)) / count(field.opportunity_id where field.opportunity_stage in ('closed_won', 'closed_lost') and in_period(field.close_date))\",\"staged\":true}"
  - name: gasp_win_rate_by_channel
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_win_rate_by_channel.value)
    description: Win Rate, by_channel breakdown. The percentage of qualified opportunities that close as won.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/sales/win-rate. Broken down by channel: report one value per channel. Staged (period bound in filter): gasp_staged_gasp_win_rate_by_channel holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"win_rate\",\"gasp_version\":\"1\",\"variant\":\"by_channel\",\"unit\":\"percent\",\"formula\":\"count(field.opportunity_id where field.opportunity_stage = 'closed_won' and in_period(field.close_date)) / count(field.opportunity_id where field.opportunity_stage in ('closed_won', 'closed_lost') and in_period(field.close_date))\",\"gasp_breakdown\":\"channel\",\"staged\":true}"
  - name: gasp_lead_to_opportunity_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_lead_to_opportunity_rate.value)
    description: Lead-to-Opportunity Rate. The percentage of leads that become qualified opportunities.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/sales/lead-to-opportunity-rate. Staged (period bound in filter): gasp_staged_gasp_lead_to_opportunity_rate holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"lead_to_opportunity_rate","gasp_version":"1","unit":"percent","formula":"count_distinct(field.opportunity_id where in_period(field.opportunity_created_date)) / count_distinct(field.lead_id where in_period(field.lead_created_date))","staged":true}'
  - name: gasp_opportunity_to_close_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_opportunity_to_close_rate.value)
    description: Opportunity-to-Close Rate. The percentage of qualified opportunities that close as won. Also called Close Rate.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/sales/opportunity-to-close-rate. Staged (period bound in filter): gasp_staged_gasp_opportunity_to_close_rate holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"opportunity_to_close_rate","gasp_version":"1","unit":"percent","formula":"metric.win_rate","staged":true}'
  - name: gasp_acv
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: AVG(CASE WHEN contract_event.contract_event_type = 'new_contract' THEN contract_event.acv END)
    description: ACV (Annual Contract Value). The annualized value of a contract, normalizing multi-year deals to a single year. Also used to describe average deal size when aggregated.
    datatype: Decimal
    ai_context:
      synonyms:
        - ACV
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/sales/acv-annual-contract-value."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"acv\",\"gasp_version\":\"1\",\"unit\":\"currency\",\"formula\":\"avg(field.acv where field.contract_event_type = 'new_contract')\"}"
  - name: gasp_average_deal_size
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_average_deal_size.value)
    description: Average Deal Size. The average total value of closed deals (total contract value, not annualized).
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/sales/average-deal-size. Staged (period bound in filter): gasp_staged_gasp_average_deal_size holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"average_deal_size\",\"gasp_version\":\"1\",\"unit\":\"currency\",\"formula\":\"sum(field.opportunity_amount where field.opportunity_stage = 'closed_won' and in_period(field.close_date)) / count(field.opportunity_id where field.opportunity_stage = 'closed_won' and in_period(field.close_date))\",\"staged\":true}"
  - name: gasp_sales_cycle
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_sales_cycle.value)
    description: Sales Cycle Length. The average time from opportunity creation to close.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/sales/sales-cycle-length. Staged (period bound in filter): gasp_staged_gasp_sales_cycle holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"sales_cycle\",\"gasp_version\":\"1\",\"unit\":\"days\",\"formula\":\"avg(field.close_date - field.opportunity_created_date where field.opportunity_stage = 'closed_won' and in_period(field.close_date))\",\"staged\":true}"
  - name: gasp_sales_cycle_median
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_sales_cycle_median.value)
    description: Sales Cycle Length, median variant. The average time from opportunity creation to close.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/sales/sales-cycle-length. Staged (period bound in filter): gasp_staged_gasp_sales_cycle_median holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"sales_cycle\",\"gasp_version\":\"1\",\"variant\":\"median\",\"unit\":\"days\",\"formula\":\"median(field.close_date - field.opportunity_created_date where field.opportunity_stage = 'closed_won' and in_period(field.close_date))\",\"staged\":true}"
  - name: gasp_quota_attainment
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(SUM(sales_rep.closed_revenue) AS DECIMAL) / NULLIF(SUM(sales_rep.quota), 0))
    description: Quota Attainment. The percentage of quota achieved by a rep or team.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/sales/quota-attainment."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"quota_attainment","gasp_version":"1","unit":"percent","formula":"sum(field.closed_revenue) / sum(field.quota)"}'
  - name: gasp_quota_attainment_mean_of_reps
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: AVG((CAST(sales_rep.closed_revenue AS DECIMAL) / NULLIF(sales_rep.quota, 0)))
    description: Quota Attainment, mean_of_reps variant. The percentage of quota achieved by a rep or team.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/sales/quota-attainment."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"quota_attainment","gasp_version":"1","variant":"mean_of_reps","unit":"percent","formula":"avg(field.closed_revenue / field.quota)"}'
  - name: gasp_revenue_per_rep
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(SUM(sales_rep.closed_revenue) AS DECIMAL) / NULLIF(COUNT(DISTINCT CASE WHEN sales_rep.quota > 0 THEN sales_rep.rep_id END), 0))
    description: Revenue per Rep. Total revenue generated divided by number of quota-carrying reps.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/sales/revenue-per-rep."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"revenue_per_rep","gasp_version":"1","unit":"currency","formula":"sum(field.closed_revenue) / count_distinct(field.rep_id where field.quota > 0)"}'
  - name: gasp_ramp_time
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(AVG(DATEDIFF(day, sales_rep.hire_date, sales_rep.ramped_date)) AS DECIMAL) / 30.4375)
    description: Ramp Time. Time for a new sales rep to reach full productivity (carrying full quota).
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/sales/ramp-time."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"ramp_time","gasp_version":"1","unit":"months","formula":"(avg(field.ramped_date - field.hire_date)) / 30.4375"}'
  - name: gasp_services_revenue
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(CASE WHEN financials.revenue_type = 'services' THEN financials.revenue ELSE 0 END)
    description: Services Revenue. Revenue from professional services (implementation, consulting, training).
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/services-revenue."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"services_revenue\",\"gasp_version\":\"1\",\"unit\":\"currency\",\"formula\":\"sum(field.revenue where field.revenue_type = 'services')\"}"
  - name: gasp_services_as_of_total_revenue
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST((SUM(CASE WHEN financials.revenue_type = 'services' THEN financials.revenue ELSE 0 END)) AS DECIMAL) / NULLIF(SUM(financials.revenue), 0))
    description: Services as % of Total Revenue. Professional services contribution to total revenue.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/services-as-of-total-revenue."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"services_as_of_total_revenue","gasp_version":"1","unit":"percent","formula":"metric.services_revenue / sum(field.revenue)"}'
  - name: gasp_services_attach_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_services_attach_rate.value)
    description: Services Attach Rate. Percentage of product deals that include services.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/services-attach-rate. Staged (period bound in filter): gasp_staged_gasp_services_attach_rate holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"services_attach_rate\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"count_distinct(field.opportunity_id where field.includes_services = true and field.opportunity_stage = 'closed_won' and in_period(field.close_date)) / count_distinct(field.opportunity_id where field.opportunity_stage = 'closed_won' and in_period(field.close_date))\",\"staged\":true}"
  - name: gasp_average_services_deal_size
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(SUM(CASE WHEN opportunity.revenue_type = 'services' THEN opportunity.opportunity_amount ELSE 0 END) AS DECIMAL) / NULLIF(COUNT(DISTINCT CASE WHEN opportunity.revenue_type = 'services' THEN opportunity.opportunity_id END), 0))
    description: Average Services Deal Size. Average value of services engagements.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/average-services-deal-size. Reads the opportunity snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"average_services_deal_size\",\"gasp_version\":\"1\",\"unit\":\"currency\",\"formula\":\"sum(field.opportunity_amount where field.revenue_type = 'services') / count_distinct(field.opportunity_id where field.revenue_type = 'services')\"}"
  - name: gasp_services_backlog
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_services_backlog.value)
    description: Services Backlog. Contracted services not yet delivered.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/services-backlog. Staged (to_date): gasp_staged_gasp_services_backlog holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"services_backlog\",\"gasp_version\":\"1\",\"unit\":\"currency\",\"formula\":\"sum(field.opportunity_amount where field.revenue_type = 'services' and field.opportunity_stage = 'closed_won') to_date - metric.services_revenue to_date\",\"staged\":true}"
  - name: gasp_services_gross_margin
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(((SUM(CASE WHEN financials.revenue_type = 'services' THEN financials.revenue ELSE 0 END)) - SUM(CASE WHEN cost_event.cost_function = 'services_delivery' THEN cost_event.cost ELSE 0 END)) AS DECIMAL) / NULLIF((SUM(CASE WHEN financials.revenue_type = 'services' THEN financials.revenue ELSE 0 END)), 0))
    description: Services Gross Margin. Services revenue minus direct delivery costs.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/services-gross-margin."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"services_gross_margin\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"(metric.services_revenue - sum(field.cost where field.cost_function = 'services_delivery')) / metric.services_revenue\"}"
  - name: gasp_project_margin
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_project_margin.value)
    description: Project Margin. Gross margin on individual projects.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/project-margin. Staged (period bound in filter): gasp_staged_gasp_project_margin holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"project_margin","gasp_version":"1","unit":"percent","formula":"(sum(field.project_revenue where in_period(field.project_completion_date)) - sum(field.project_cost where in_period(field.project_completion_date))) / sum(field.project_revenue where in_period(field.project_completion_date))","staged":true}'
  - name: gasp_realization_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(SUM(time_entry.billed_revenue) AS DECIMAL) / NULLIF(SUM((time_entry.billed_hours * time_entry.standard_rate)), 0))
    description: Realization Rate. Actual revenue realized vs potential revenue at standard rates.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/realization-rate."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"realization_rate","gasp_version":"1","unit":"percent","formula":"sum(field.billed_revenue) / sum(field.billed_hours * field.standard_rate)"}'
  - name: gasp_write_off_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(SUM(time_entry.written_off_hours) AS DECIMAL) / NULLIF(SUM(time_entry.billed_hours), 0))
    description: Write-off Rate. Percentage of billable hours written off (not billed to client).
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/write-off-rate."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"write_off_rate","gasp_version":"1","unit":"percent","formula":"sum(field.written_off_hours) / sum(field.billed_hours)"}'
  - name: gasp_billable_utilization
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(SUM(CASE WHEN time_entry.time_entry_type = 'billable' THEN time_entry.hours ELSE 0 END) AS DECIMAL) / NULLIF(SUM(consultant.available_hours), 0))
    description: Billable Utilization. Percentage of available time spent on billable work.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/billable-utilization."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"billable_utilization\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"sum(field.hours where field.time_entry_type = 'billable') / sum(field.available_hours)\"}"
  - name: gasp_total_utilization
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(SUM(CASE WHEN time_entry.time_entry_type IN ('billable', 'training', 'pre_sales', 'internal') THEN time_entry.hours ELSE 0 END) AS DECIMAL) / NULLIF(SUM(consultant.available_hours), 0))
    description: Total Utilization. Percentage of time spent on all productive work (billable + non-billable).
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/total-utilization."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"total_utilization\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"sum(field.hours where field.time_entry_type in ('billable', 'training', 'pre_sales', 'internal')) / sum(field.available_hours)\"}"
  - name: gasp_bench_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(DISTINCT CASE WHEN project.project_id IS NULL THEN project.consultant_id END) AS DECIMAL) / NULLIF(COUNT(DISTINCT consultant.consultant_id), 0))
    description: Bench Rate. Percentage of team without billable assignment.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/bench-rate. Reads the project snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"bench_rate","gasp_version":"1","unit":"percent","formula":"count_distinct(field.consultant_id where field.project_id is null) / count_distinct(field.consultant_id)"}'
  - name: gasp_capacity
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(consultant.available_hours)
    description: Capacity. Total billable hours available in period.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/capacity."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"capacity","gasp_version":"1","unit":"hours","formula":"sum(field.available_hours)"}'
  - name: gasp_capacity_utilization
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(SUM(project.hours_budgeted) AS DECIMAL) / NULLIF((SUM(consultant.available_hours)), 0))
    description: Capacity Utilization. Billable hours sold vs available.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/capacity-utilization. Reads the project snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"capacity_utilization","gasp_version":"1","unit":"percent","formula":"sum(field.hours_budgeted) / metric.capacity"}'
  - name: gasp_on_time_delivery
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_on_time_delivery.value)
    description: On-Time Delivery. Percentage of projects delivered by committed date.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/on-time-delivery. Staged (period bound in filter): gasp_staged_gasp_on_time_delivery holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"on_time_delivery","gasp_version":"1","unit":"percent","formula":"count_distinct(field.project_id where in_period(field.project_completion_date) and field.project_completion_date <= field.target_date) / count_distinct(field.project_id where in_period(field.project_completion_date))","staged":true}'
  - name: gasp_on_budget_delivery
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_on_budget_delivery.value)
    description: On-Budget Delivery. Percentage of projects delivered within budget.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/on-budget-delivery. Staged (period bound in filter): gasp_staged_gasp_on_budget_delivery holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"on_budget_delivery","gasp_version":"1","unit":"percent","formula":"count_distinct(field.project_id where in_period(field.project_completion_date) and field.hours_actual <= field.hours_budgeted) / count_distinct(field.project_id where in_period(field.project_completion_date))","staged":true}'
  - name: gasp_scope_change_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(DISTINCT CASE WHEN project.scope_changed = TRUE THEN project.project_id END) AS DECIMAL) / NULLIF(COUNT(DISTINCT project.project_id), 0))
    description: Scope Change Rate. Percentage of projects with scope changes.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/scope-change-rate. Reads the project snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"scope_change_rate","gasp_version":"1","unit":"percent","formula":"count_distinct(field.project_id where field.scope_changed = true) / count_distinct(field.project_id)"}'
  - name: gasp_project_duration_accuracy
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_project_duration_accuracy.value)
    description: Project Duration Accuracy. Actual duration vs estimated duration.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/project-duration-accuracy. Staged (period bound in filter): gasp_staged_gasp_project_duration_accuracy holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"project_duration_accuracy","gasp_version":"1","unit":"percent","formula":"avg((field.target_date - field.project_start_date) / (field.project_completion_date - field.project_start_date) where in_period(field.project_completion_date))","staged":true}'
  - name: gasp_project_csat
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(CASE WHEN (survey_response.survey_type = 'project' AND survey_response.satisfaction_score >= 4) THEN survey_response.satisfaction_score END) AS DECIMAL) / NULLIF(COUNT(CASE WHEN survey_response.survey_type = 'project' THEN survey_response.satisfaction_score END), 0))
    description: Project CSAT. Customer satisfaction with services engagement.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/project-csat."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"project_csat\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"count(field.satisfaction_score where field.survey_type = 'project' and field.satisfaction_score >= 4) / count(field.satisfaction_score where field.survey_type = 'project')\"}"
  - name: gasp_project_nps
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: ((CAST((COUNT(CASE WHEN (survey_response.survey_type = 'project' AND survey_response.nps_score >= 9) THEN survey_response.nps_score END) - COUNT(CASE WHEN (survey_response.survey_type = 'project' AND survey_response.nps_score <= 6) THEN survey_response.nps_score END)) AS DECIMAL) / NULLIF(COUNT(CASE WHEN survey_response.survey_type = 'project' THEN survey_response.nps_score END), 0)) * 100)
    description: Project NPS. Net Promoter Score for services experience.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/project-nps."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"project_nps\",\"gasp_version\":\"1\",\"unit\":\"score\",\"formula\":\"(count(field.nps_score where field.survey_type = 'project' and field.nps_score >= 9) - count(field.nps_score where field.survey_type = 'project' and field.nps_score <= 6)) / count(field.nps_score where field.survey_type = 'project') * 100\"}"
  - name: gasp_rework_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(DISTINCT CASE WHEN deliverable.reworked = TRUE THEN deliverable.deliverable_id END) AS DECIMAL) / NULLIF(COUNT(DISTINCT deliverable.deliverable_id), 0))
    description: Rework Rate. Percentage of deliverables requiring rework.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/rework-rate. Reads the deliverable snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"rework_rate","gasp_version":"1","unit":"percent","formula":"count_distinct(field.deliverable_id where field.reworked = true) / count_distinct(field.deliverable_id)"}'
  - name: gasp_reference_ability
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_reference_ability.value)
    description: Reference-ability. Percentage of completed projects that become referenceable.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/reference-ability. Staged (period bound in filter): gasp_staged_gasp_reference_ability holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"reference_ability","gasp_version":"1","unit":"percent","formula":"count_distinct(field.project_id where in_period(field.project_completion_date) and field.referenceable = true) / count_distinct(field.project_id where in_period(field.project_completion_date))","staged":true}'
  - name: gasp_revenue_per_consultant
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST((SUM(CASE WHEN financials.revenue_type = 'services' THEN financials.revenue ELSE 0 END)) AS DECIMAL) / NULLIF(COUNT(DISTINCT consultant.consultant_id), 0))
    description: Revenue per Consultant. Services revenue per delivery resource.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/revenue-per-consultant."
    custom_extensions:
