metrics:
  - name: gasp_mrr
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(CASE WHEN subscription.subscription_status = 'active' THEN subscription.mrr ELSE 0 END)
    description: MRR (Monthly Recurring Revenue). The total predictable revenue from active subscriptions, normalized to a monthly value.
    datatype: Decimal
    ai_context:
      synonyms:
        - MRR
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/core/mrr-monthly-recurring-revenue. Reads the subscription snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"mrr\",\"gasp_version\":\"1\",\"unit\":\"currency\",\"formula\":\"sum(field.mrr where field.subscription_status = 'active') at period_end\"}"
  - name: gasp_mrr_by_plan
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(CASE WHEN subscription.subscription_status = 'active' THEN subscription.mrr ELSE 0 END)
    description: MRR (Monthly Recurring Revenue), by_plan breakdown. The total predictable revenue from active subscriptions, normalized to a monthly value.
    datatype: Decimal
    ai_context:
      synonyms:
        - MRR
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/core/mrr-monthly-recurring-revenue. Broken down by plan_id: report one value per plan_id by grouping on the plan_id field of each dataset the expression reads. Reads the subscription snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"mrr\",\"gasp_version\":\"1\",\"variant\":\"by_plan\",\"unit\":\"currency\",\"formula\":\"sum(field.mrr where field.subscription_status = 'active') at period_end\",\"gasp_breakdown\":\"plan_id\"}"
  - name: gasp_mrr_by_segment
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(CASE WHEN subscription.subscription_status = 'active' THEN subscription.mrr ELSE 0 END)
    description: MRR (Monthly Recurring Revenue), by_segment breakdown. The total predictable revenue from active subscriptions, normalized to a monthly value.
    datatype: Decimal
    ai_context:
      synonyms:
        - MRR
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/core/mrr-monthly-recurring-revenue. Broken down by segment: report one value per segment by grouping on the segment field of each dataset the expression reads. Reads the subscription snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"mrr\",\"gasp_version\":\"1\",\"variant\":\"by_segment\",\"unit\":\"currency\",\"formula\":\"sum(field.mrr where field.subscription_status = 'active') at period_end\",\"gasp_breakdown\":\"segment\"}"
  - name: gasp_arr
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: ((SUM(CASE WHEN subscription.subscription_status = 'active' THEN subscription.mrr ELSE 0 END)) * 12)
    description: ARR (Annual Recurring Revenue). The annualized value of recurring revenue. ARR represents the yearly run rate of subscription revenue.
    datatype: Decimal
    ai_context:
      synonyms:
        - ARR
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/core/arr-annual-recurring-revenue. Reads the subscription snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"arr","gasp_version":"1","unit":"currency","formula":"metric.mrr * 12"}'
  - name: gasp_arr_o
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_arr_o.value)
    description: ARR (Annual Recurring Revenue), Operating form. The annualized value of recurring revenue. ARR represents the yearly run rate of subscription revenue.
    datatype: Decimal
    ai_context:
      synonyms:
        - ARR
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/core/arr-annual-recurring-revenue. Staged (cohort): gasp_staged_gasp_arr_o holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"arr\",\"gasp_version\":\"1\",\"form\":\"O\",\"unit\":\"currency\",\"formula\":\"(metric.mrr - window(sum(field.mrr_change where field.expansion_classification in ('pricing_adjustment', 'recontracting')), 12 month)) * 12 over cohort(field.customer_id, period_end)\",\"staged\":true}"
  - name: gasp_arr_m
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: ((SUM(CASE WHEN subscription.subscription_status = 'active' THEN subscription.mrr ELSE 0 END)) * 12)
    description: ARR (Annual Recurring Revenue), Market form. The annualized value of recurring revenue. ARR represents the yearly run rate of subscription revenue.
    datatype: Decimal
    ai_context:
      synonyms:
        - ARR
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/core/arr-annual-recurring-revenue. Reads the subscription snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"arr","gasp_version":"1","form":"M","unit":"currency","formula":"metric.mrr * 12"}'
  - name: gasp_arr_by_segment
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: ((SUM(CASE WHEN subscription.subscription_status = 'active' THEN subscription.mrr ELSE 0 END)) * 12)
    description: ARR (Annual Recurring Revenue), by_segment breakdown. The annualized value of recurring revenue. ARR represents the yearly run rate of subscription revenue.
    datatype: Decimal
    ai_context:
      synonyms:
        - ARR
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/core/arr-annual-recurring-revenue. Broken down by segment: report one value per segment by grouping on the segment field of each dataset the expression reads. Reads the subscription snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"arr","gasp_version":"1","variant":"by_segment","unit":"currency","formula":"metric.mrr * 12","gasp_breakdown":"segment"}'
  - name: gasp_arpa
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST((SUM(CASE WHEN subscription.subscription_status = 'active' THEN subscription.mrr ELSE 0 END)) AS DECIMAL) / NULLIF(COUNT(DISTINCT CASE WHEN customer.customer_status = 'active' THEN customer.customer_id END), 0))
    description: ARPA (Average Revenue Per Account). Average monthly recurring revenue per customer.
    datatype: Decimal
    ai_context:
      synonyms:
        - ARPA
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/core/arpa-average-revenue-per-account. Reads the customer and subscription snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
