  - name: gasp_deal_registration_to_close_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_deal_registration_to_close_rate.value)
    description: Deal Registration-to-Close Rate. Percentage of registered deals that close.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/partnerships/deal-registration-to-close-rate. Staged (period bound in filter): gasp_staged_gasp_deal_registration_to_close_rate holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"deal_registration_to_close_rate\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"count_distinct(field.registration_id where field.opportunity_stage = 'closed_won' and in_period(field.close_date)) / count_distinct(field.registration_id where in_period(field.registration_date))\",\"staged\":true}"
  - name: gasp_partner_win_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_partner_win_rate.value)
    description: Partner Win Rate. Win rate on partner-involved opportunities.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/partnerships/partner-win-rate. Staged (period bound in filter): gasp_staged_gasp_partner_win_rate holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"partner_win_rate\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"count(field.opportunity_id where field.partner_id is not null and field.opportunity_stage = 'closed_won' and in_period(field.close_date)) / count(field.opportunity_id where field.partner_id is not null and field.opportunity_stage in ('closed_won', 'closed_lost') and in_period(field.close_date))\",\"staged\":true}"
  - name: gasp_partner_deal_size
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_partner_deal_size.value)
    description: Partner Deal Size. Average deal size for partner-sourced deals.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/partnerships/partner-deal-size. Staged (period bound in filter): gasp_staged_gasp_partner_deal_size holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"partner_deal_size\",\"gasp_version\":\"1\",\"unit\":\"currency\",\"formula\":\"metric.partner_sourced_revenue / count(field.opportunity_id where field.partner_sourced = true and field.opportunity_stage = 'closed_won' and in_period(field.close_date))\",\"staged\":true}"
  - name: gasp_partner_sales_cycle
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_partner_sales_cycle.value)
    description: Partner Sales Cycle. Average sales cycle for partner-sourced deals.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/partnerships/partner-sales-cycle. Staged (period bound in filter): gasp_staged_gasp_partner_sales_cycle holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"partner_sales_cycle\",\"gasp_version\":\"1\",\"unit\":\"days\",\"formula\":\"median(field.close_date - field.registration_date where field.opportunity_stage = 'closed_won' and in_period(field.close_date))\",\"staged\":true}"
  - name: gasp_certification_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(DISTINCT CASE WHEN partner.certification_status = 'certified' THEN partner.partner_id END) AS DECIMAL) / NULLIF((COUNT(DISTINCT CASE WHEN partner.partner_status = 'active' THEN partner.partner_id END)), 0))
    description: Certification Rate. Percentage of partners with current certifications.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/partnerships/certification-rate. Reads the partner snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"certification_rate\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"count_distinct(field.partner_id where field.certification_status = 'certified') / metric.total_active_partners\"}"
  - name: gasp_training_completion
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(DISTINCT CASE WHEN partner.training_completed = TRUE THEN partner.partner_id END) AS DECIMAL) / NULLIF(COUNT(DISTINCT partner.partner_id), 0))
    description: Training Completion. Percentage of partners completing required training.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/partnerships/training-completion. Reads the partner snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"training_completion","gasp_version":"1","unit":"percent","formula":"count_distinct(field.partner_id where field.training_completed = true) / count_distinct(field.partner_id)"}'
  - name: gasp_joint_marketing_activities
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: COUNT(CASE WHEN partner_activity.partner_activity_type IN ('webinar', 'event', 'content', 'campaign') THEN partner_activity.activity_id END)
    description: Joint Marketing Activities. Number of co-marketing activities with partners.
    datatype: Integer
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/partnerships/joint-marketing-activities."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"joint_marketing_activities\",\"gasp_version\":\"1\",\"unit\":\"count\",\"formula\":\"count(field.activity_id where field.partner_activity_type in ('webinar', 'event', 'content', 'campaign'))\"}"
  - name: gasp_partner_nps
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: ((CAST((COUNT(CASE WHEN (survey_response.survey_type = 'partner' AND survey_response.nps_score >= 9) THEN survey_response.nps_score END) - COUNT(CASE WHEN (survey_response.survey_type = 'partner' AND survey_response.nps_score <= 6) THEN survey_response.nps_score END)) AS DECIMAL) / NULLIF(COUNT(CASE WHEN survey_response.survey_type = 'partner' THEN survey_response.nps_score END), 0)) * 100)
    description: Partner NPS. Net Promoter Score from partner satisfaction surveys.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/partnerships/partner-nps."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"partner_nps\",\"gasp_version\":\"1\",\"unit\":\"score\",\"formula\":\"(count(field.nps_score where field.survey_type = 'partner' and field.nps_score >= 9) - count(field.nps_score where field.survey_type = 'partner' and field.nps_score <= 6)) / count(field.nps_score where field.survey_type = 'partner') * 100\"}"
  - name: gasp_partner_margin_commission
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_partner_margin_commission.value)
    description: Partner Margin / Commission. Compensation paid to partners.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/partnerships/partner-margin-commission. Staged (period bound in filter): gasp_staged_gasp_partner_margin_commission holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"partner_margin_commission\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"sum(field.cost where field.cost_function = 'partner_commission') / metric.partner_sourced_revenue\",\"staged\":true}"
  - name: gasp_cost_of_partner_acquisition
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_cost_of_partner_acquisition.value)
    description: Cost of Partner Acquisition. Cost to recruit and onboard a new partner.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/partnerships/cost-of-partner-acquisition. Staged (period bound in filter): gasp_staged_gasp_cost_of_partner_acquisition holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"cost_of_partner_acquisition\",\"gasp_version\":\"1\",\"unit\":\"currency\",\"formula\":\"sum(field.cost where field.cost_function = 'partner_program') / count_distinct(field.partner_id where in_period(field.partner_recruited_date))\",\"staged\":true}"
  - name: gasp_partner_lifetime_value
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_partner_lifetime_value.value)
    description: Partner Lifetime Value. Expected revenue from a partner over their lifetime.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/partnerships/partner-lifetime-value. Staged (at period_start): gasp_staged_gasp_partner_lifetime_value holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"partner_lifetime_value","gasp_version":"1","unit":"currency","formula":"metric.average_partner_revenue / metric.partner_churn_rate","staged":true}'
  - name: gasp_partner_roi
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_partner_roi.value)
    description: Partner ROI. Return on investment in partner program.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/partnerships/partner-roi. Staged (period bound in filter): gasp_staged_gasp_partner_roi holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"partner_roi\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"(metric.partner_sourced_revenue - sum(field.cost where field.cost_function = 'partner_program')) / sum(field.cost where field.cost_function = 'partner_program')\",\"staged\":true}"
  - name: gasp_marketplace_revenue
    expression:
