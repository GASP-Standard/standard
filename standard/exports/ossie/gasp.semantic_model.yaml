        data: '{"gasp_id":"mttr","gasp_version":"1","variant":"by_severity","unit":"minutes","formula":"(avg(field.resolved_at - field.started_at)) * 1440","gasp_breakdown":"severity"}'
  - name: gasp_mttr_by_incident_type
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (AVG((DATEDIFF(second, incident.started_at, incident.resolved_at) / 86400.0)) * 1440)
    description: Mean Time to Resolve (MTTR), by_incident_type breakdown. Time from incident start to resolution.
    datatype: Decimal
    ai_context:
      synonyms:
        - MTTR
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/engineering/mean-time-to-resolve-mttr. Broken down by incident_type: report one value per incident_type by grouping on the incident_type field of each dataset the expression reads."
    custom_extensions:
