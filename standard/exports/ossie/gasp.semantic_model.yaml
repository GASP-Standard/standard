      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/engineering/mean-time-to-acknowledge-mtta."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"mean_time_to_acknowledge_mtta","gasp_version":"1","unit":"minutes","formula":"(avg(field.acknowledged_at - field.detected_at)) * 1440"}'
  - name: gasp_mttr
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (AVG((DATEDIFF(second, incident.started_at, incident.resolved_at) / 86400.0)) * 1440)
    description: Mean Time to Resolve (MTTR). Time from incident start to resolution.
