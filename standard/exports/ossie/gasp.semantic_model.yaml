        data: '{"gasp_id":"mttr","gasp_version":"1","variant":"by_incident_type","unit":"minutes","formula":"(avg(field.resolved_at - field.started_at)) * 1440","gasp_breakdown":"incident_type"}'
  - name: gasp_change_failure_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(DISTINCT CASE WHEN deployment.incident_id IS NOT NULL THEN deployment.deployment_id END) AS DECIMAL) / NULLIF(COUNT(DISTINCT deployment.deployment_id), 0))
    description: Change Failure Rate. Percentage of deployments that cause incidents.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/engineering/change-failure-rate."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"change_failure_rate","gasp_version":"1","unit":"percent","formula":"count_distinct(field.deployment_id where field.incident_id is not null) / count_distinct(field.deployment_id)"}'
  - name: gasp_deployment_frequency
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: COUNT(DISTINCT deployment.deployment_id)
    description: Deployment Frequency. How often code is deployed to production.
    datatype: Integer
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/engineering/deployment-frequency."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"deployment_frequency","gasp_version":"1","unit":"count","formula":"count_distinct(field.deployment_id)"}'
  - name: gasp_lead_time_for_changes
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (MEDIAN((DATEDIFF(second, deployment.committed_at, deployment.deploy_date) / 86400.0)) * 24)
    description: Lead Time for Changes. Time from code commit to production deployment.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/engineering/lead-time-for-changes."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"lead_time_for_changes","gasp_version":"1","unit":"hours","formula":"(median(field.deploy_date - field.committed_at)) * 24"}'
  - name: gasp_mean_time_to_recovery_mttr
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: AVG(incident.recovery_time)
    description: Mean Time to Recovery (MTTR). Time to restore service after a failure.
    datatype: Decimal
    ai_context:
      synonyms:
        - MTTR
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/engineering/mean-time-to-recovery-mttr."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"mean_time_to_recovery_mttr","gasp_version":"1","unit":"minutes","formula":"avg(field.recovery_time)"}'
  - name: gasp_infrastructure_utilization
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: AVG(service_metrics.utilization)
    description: Infrastructure Utilization. Percentage of provisioned capacity being used.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/engineering/infrastructure-utilization."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"infrastructure_utilization","gasp_version":"1","unit":"percent","formula":"avg(field.utilization)"}'
  - name: gasp_infrastructure_cost_per_customer
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(SUM(CASE WHEN cost_event.cost_function = 'infrastructure' THEN cost_event.cost ELSE 0 END) AS DECIMAL) / NULLIF(COUNT(DISTINCT CASE WHEN customer.customer_status = 'active' THEN customer.customer_id END), 0))
    description: Infrastructure Cost per Customer. Total infrastructure cost divided by active customers.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/engineering/infrastructure-cost-per-customer. Reads the customer snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"infrastructure_cost_per_customer\",\"gasp_version\":\"1\",\"unit\":\"currency\",\"formula\":\"sum(field.cost where field.cost_function = 'infrastructure') / count_distinct(field.customer_id where field.customer_status = 'active') at period_end\"}"
  - name: gasp_headroom
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (1 - (AVG(service_metrics.utilization)))
    description: Headroom. Available capacity before scaling is required.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/engineering/headroom."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"headroom","gasp_version":"1","unit":"percent","formula":"1 - metric.infrastructure_utilization"}'
  - name: gasp_vulnerability_count
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: COUNT(DISTINCT CASE WHEN vulnerability.vulnerability_status = 'open' THEN vulnerability.vulnerability_id END)
    description: Vulnerability Count. Number of known vulnerabilities in systems.
    datatype: Integer
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/engineering/vulnerability-count. Reads the vulnerability snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"vulnerability_count\",\"gasp_version\":\"1\",\"unit\":\"count\",\"formula\":\"count_distinct(field.vulnerability_id where field.vulnerability_status = 'open')\"}"
  - name: gasp_time_to_patch
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_time_to_patch.value)
    description: Time to Patch. Time from vulnerability disclosure to patch deployment.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/engineering/time-to-patch. Staged (period bound in filter): gasp_staged_gasp_time_to_patch holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"time_to_patch","gasp_version":"1","unit":"hours","formula":"(avg(field.patched_at - field.discovered_at where in_period(field.patched_at))) * 24","staged":true}'
  - name: gasp_security_incident_count
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: COUNT(DISTINCT CASE WHEN incident.incident_type = 'security' THEN incident.incident_id END)
    description: Security Incident Count. Number of security incidents in a period.
    datatype: Integer
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/engineering/security-incident-count."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"security_incident_count\",\"gasp_version\":\"1\",\"unit\":\"count\",\"formula\":\"count_distinct(field.incident_id where field.incident_type = 'security')\"}"
  - name: gasp_revenue_gaap
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(financials.revenue)
    description: Revenue (GAAP). Recognized revenue according to accounting standards.
    datatype: Decimal
    ai_context:
      synonyms:
        - GAAP
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/finance/revenue-gaap."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"revenue_gaap","gasp_version":"1","unit":"currency","formula":"sum(field.revenue)"}'
  - name: gasp_bookings
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(CASE WHEN contract_event.contract_event_type IN ('new_contract', 'renewal', 'amendment') THEN contract_event.tcv ELSE 0 END)
    description: Bookings. Total contract value signed in a period.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/finance/bookings."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"bookings\",\"gasp_version\":\"1\",\"unit\":\"currency\",\"formula\":\"sum(field.tcv where field.contract_event_type in ('new_contract', 'renewal', 'amendment'))\"}"
  - name: gasp_bookings_new
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(CASE WHEN contract_event.contract_event_type = 'new_contract' THEN contract_event.tcv ELSE 0 END)
    description: Bookings, new variant. Total contract value signed in a period.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/finance/bookings."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"bookings\",\"gasp_version\":\"1\",\"variant\":\"new\",\"unit\":\"currency\",\"formula\":\"sum(field.tcv where field.contract_event_type = 'new_contract')\"}"
  - name: gasp_bookings_renewal
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(CASE WHEN contract_event.contract_event_type = 'renewal' THEN contract_event.tcv ELSE 0 END)
    description: Bookings, renewal variant. Total contract value signed in a period.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/finance/bookings."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"bookings\",\"gasp_version\":\"1\",\"variant\":\"renewal\",\"unit\":\"currency\",\"formula\":\"sum(field.tcv where field.contract_event_type = 'renewal')\"}"
  - name: gasp_bookings_expansion
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(CASE WHEN contract_event.contract_event_type = 'amendment' THEN contract_event.tcv ELSE 0 END)
    description: Bookings, expansion variant. Total contract value signed in a period.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/finance/bookings."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"bookings\",\"gasp_version\":\"1\",\"variant\":\"expansion\",\"unit\":\"currency\",\"formula\":\"sum(field.tcv where field.contract_event_type = 'amendment')\"}"
  - name: gasp_billings
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_billings.value)
    description: Billings. Amounts invoiced in a period.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/finance/billings. Staged (period bound in filter): gasp_staged_gasp_billings holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"billings","gasp_version":"1","unit":"currency","formula":"sum(field.invoice_amount where in_period(field.invoice_date))","staged":true}'
  - name: gasp_billings_by_payment_status
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_billings_by_payment_status.value)
    description: Billings, by_payment_status breakdown. Amounts invoiced in a period.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/finance/billings. Broken down by payment_status: report one value per payment_status. Staged (period bound in filter): gasp_staged_gasp_billings_by_payment_status holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"billings","gasp_version":"1","variant":"by_payment_status","unit":"currency","formula":"sum(field.invoice_amount where in_period(field.invoice_date))","gasp_breakdown":"payment_status","staged":true}'
  - name: gasp_revenue_per_employee
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST((((SUM(CASE WHEN subscription.subscription_status = 'active' THEN subscription.mrr ELSE 0 END)) * 12)) AS DECIMAL) / NULLIF((COUNT(DISTINCT CASE WHEN employee.employee_status = 'active' THEN employee.employee_id END)), 0))
    description: Revenue per Employee. Total revenue divided by headcount.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/finance/revenue-per-employee. Reads the employee and subscription snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"revenue_per_employee","gasp_version":"1","unit":"currency","formula":"metric.arr / metric.total_headcount"}'
  - name: gasp_operating_margin
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (((CAST((SUM(financials.revenue) - SUM(CASE WHEN cost_event.cost_function = 'infrastructure' THEN cost_event.cost ELSE 0 END)) AS DECIMAL) / NULLIF(SUM(financials.revenue), 0))) - ((CAST(SUM(CASE WHEN cost_event.cost_function <> 'infrastructure' THEN cost_event.cost ELSE 0 END) AS DECIMAL) / NULLIF((SUM(financials.revenue)), 0))))
    description: Operating Margin (EBIT Margin). Operating income as a percentage of revenue.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/finance/operating-margin-ebit-margin."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"operating_margin","gasp_version":"1","unit":"percent","formula":"metric.gross_margin - metric.opex_ratio"}'
  - name: gasp_ebitda_margin
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(SUM(financials.ebitda) AS DECIMAL) / NULLIF((SUM(financials.revenue)), 0))
    description: EBITDA Margin. Earnings before interest, taxes, depreciation and amortization as a percentage of revenue.
    datatype: Decimal
    ai_context:
      synonyms:
        - EBITDA
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/finance/ebitda-margin."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"ebitda_margin","gasp_version":"1","unit":"percent","formula":"sum(field.ebitda) / metric.revenue_gaap"}'
  - name: gasp_net_income_margin
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(SUM(financials.net_income) AS DECIMAL) / NULLIF((SUM(financials.revenue)), 0))
    description: Net Income Margin. Net income as a percentage of revenue.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/finance/net-income-margin."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"net_income_margin","gasp_version":"1","unit":"percent","formula":"sum(field.net_income) / metric.revenue_gaap"}'
  - name: gasp_burn_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_burn_rate.value)
    description: Cash Burn Rate. Net cash consumed per month.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/finance/cash-burn-rate. Staged (at period_start): gasp_staged_gasp_burn_rate holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"burn_rate","gasp_version":"1","unit":"currency","formula":"(sum(field.cash_balance) at period_start - sum(field.cash_balance) at period_end) / (period_days / 30.4375)","staged":true}'
  - name: gasp_cash_runway
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_cash_runway.value)
    description: Cash Runway. Time until cash runs out at current burn rate.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/finance/cash-runway. Staged (at period_start): gasp_staged_gasp_cash_runway holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"cash_runway","gasp_version":"1","unit":"months","formula":"sum(field.cash_balance) at period_end / metric.burn_rate","staged":true}'
  - name: gasp_fcf
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (SUM(financials.operating_cash_flow) - SUM(financials.capital_expenditures))
    description: Free Cash Flow (FCF). Cash generated from operations minus capital expenditures.
    datatype: Decimal
    ai_context:
      synonyms:
        - FCF
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/finance/free-cash-flow-fcf."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"fcf","gasp_version":"1","unit":"currency","formula":"sum(field.operating_cash_flow) - sum(field.capital_expenditures)"}'
  - name: gasp_free_cash_flow_margin
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(((SUM(financials.operating_cash_flow) - SUM(financials.capital_expenditures))) AS DECIMAL) / NULLIF((SUM(financials.revenue)), 0))
    description: Free Cash Flow Margin. FCF as a percentage of revenue.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/finance/free-cash-flow-margin."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"free_cash_flow_margin","gasp_version":"1","unit":"percent","formula":"metric.fcf / metric.revenue_gaap"}'
  - name: gasp_magic_number
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_magic_number.value)
    description: Magic Number. Sales efficiency metric measuring revenue generated per dollar of sales and marketing spend.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/finance/magic-number. Staged (lag): gasp_staged_gasp_magic_number holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"magic_number\",\"gasp_version\":\"1\",\"unit\":\"ratio\",\"formula\":\"(metric.arr - lag(metric.arr, 1 quarter)) / lag(window(sum(field.cost where field.cost_function = 'gtm'), 1 quarter), 1 quarter)\",\"staged\":true}"
  - name: gasp_burn_multiple
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_burn_multiple.value)
    description: Burn Multiple. Net burn divided by net new ARR. Popularized by David Sacks.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/finance/burn-multiple. Staged (at period_start): gasp_staged_gasp_burn_multiple holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"burn_multiple","gasp_version":"1","unit":"ratio","formula":"metric.burn_rate / (metric.net_new_mrr * 12)","staged":true}'
  - name: gasp_opex_ratio
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
