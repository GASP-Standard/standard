  - name: gasp_staged_gasp_arr_o
    source: SELECT p.period_start, p.period_end, (((((SELECT SUM(mrr) FROM gasp.subscription WHERE snapshot_date = p.period_end AND subscription_status = 'active' AND customer_id IN (SELECT customer_id FROM gasp.customer WHERE snapshot_date = p.period_end AND customer_status = 'active'))) - (SELECT SUM(mrr_change) FROM gasp.revenue_event WHERE event_date > (p.period_end - INTERVAL '12 month') AND event_date <= p.period_end AND expansion_classification IN ('pricing_adjustment', 'recontracting') AND customer_id IN (SELECT customer_id FROM gasp.customer WHERE snapshot_date = p.period_end AND customer_status = 'active'))) * 12)) AS value FROM gasp.period_spine p
    description: "Staged dataset for gasp_arr_o: one row per reporting period holding the metric value, computed by the GASP compiled query (needs cohort, window)."
    primary_key:
      - period_start
    fields:
      - name: period_start
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: period_start
        dimension:
          is_time: true
        datatype: Date
        description: First day of the reporting period
      - name: period_end
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: period_end
        datatype: Date
        description: Last day of the reporting period
      - name: value
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: value
        datatype: Decimal
        description: ARR (Annual Recurring Revenue), Operating form for the period
    custom_extensions:
      - vendor_name: GASP
        data: '{"staged":true,"for":"gasp_arr_o","reason":"cohort"}'
  - name: gasp_staged_gasp_mrr_growth_rate
    source: SELECT p.period_start, p.period_end, ((CAST((((SELECT SUM(mrr) FROM gasp.subscription WHERE snapshot_date = p.period_end AND subscription_status = 'active')) - ((SELECT SUM(mrr) FROM gasp.subscription WHERE snapshot_date = (p.period_end - INTERVAL '1 month') AND subscription_status = 'active'))) AS DOUBLE PRECISION) / NULLIF(((SELECT SUM(mrr) FROM gasp.subscription WHERE snapshot_date = (p.period_end - INTERVAL '1 month') AND subscription_status = 'active')), 0))) AS value FROM gasp.period_spine p
    description: "Staged dataset for gasp_mrr_growth_rate: one row per reporting period holding the metric value, computed by the GASP compiled query (needs lag)."
    primary_key:
      - period_start
    fields:
      - name: period_start
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: period_start
        dimension:
          is_time: true
        datatype: Date
        description: First day of the reporting period
      - name: period_end
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: period_end
        datatype: Date
        description: Last day of the reporting period
      - name: value
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: value
        datatype: Decimal
        description: MRR Growth Rate for the period
    custom_extensions:
      - vendor_name: GASP
        data: '{"staged":true,"for":"gasp_mrr_growth_rate","reason":"lag"}'
  - name: gasp_staged_gasp_carry_mrr
    source: SELECT p.period_start, p.period_end, (((((SELECT SUM(mrr) FROM gasp.subscription WHERE snapshot_date = p.period_start AND subscription_status = 'active')) - ((-(SELECT SUM(mrr_change) FROM gasp.revenue_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND event_type = 'churn')))) - ((-(SELECT SUM(mrr_change) FROM gasp.revenue_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND event_type = 'contraction'))))) AS value FROM gasp.period_spine p
    description: "Staged dataset for gasp_carry_mrr: one row per reporting period holding the metric value, computed by the GASP compiled query (needs at period_start)."
    primary_key:
      - period_start
    fields:
      - name: period_start
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: period_start
        dimension:
          is_time: true
        datatype: Date
        description: First day of the reporting period
      - name: period_end
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: period_end
        datatype: Date
        description: Last day of the reporting period
      - name: value
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: value
        datatype: Decimal
        description: Carry MRR for the period
    custom_extensions:
      - vendor_name: GASP
