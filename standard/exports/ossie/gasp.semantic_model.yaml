  - name: gasp_pipeline_hygiene_score
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(((((CAST(COUNT(DISTINCT CASE WHEN opportunity.required_fields_complete = TRUE THEN opportunity.opportunity_id END) AS DECIMAL) / NULLIF(COUNT(DISTINCT opportunity.opportunity_id), 0)) + (CAST(COUNT(DISTINCT CASE WHEN opportunity.updated_within_sla = TRUE THEN opportunity.opportunity_id END) AS DECIMAL) / NULLIF(COUNT(DISTINCT opportunity.opportunity_id), 0))) + (CAST(COUNT(DISTINCT CASE WHEN opportunity.close_date_valid = TRUE THEN opportunity.opportunity_id END) AS DECIMAL) / NULLIF(COUNT(DISTINCT opportunity.opportunity_id), 0))) + (CAST(COUNT(DISTINCT CASE WHEN opportunity.stage_accurate = TRUE THEN opportunity.opportunity_id END) AS DECIMAL) / NULLIF(COUNT(DISTINCT opportunity.opportunity_id), 0))) AS DECIMAL) / 4)
    description: Pipeline Hygiene Score. Quality assessment of pipeline data and process adherence.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/revops/pipeline-hygiene-score. Reads the opportunity snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"pipeline_hygiene_score","gasp_version":"1","unit":"percent","formula":"(count_distinct(field.opportunity_id where field.required_fields_complete = true) / count_distinct(field.opportunity_id) + count_distinct(field.opportunity_id where field.updated_within_sla = true) / count_distinct(field.opportunity_id) + count_distinct(field.opportunity_id where field.close_date_valid = true) / count_distinct(field.opportunity_id) + count_distinct(field.opportunity_id where field.stage_accurate = true) / count_distinct(field.opportunity_id)) / 4"}'
