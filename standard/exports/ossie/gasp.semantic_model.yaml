  - name: gasp_mean_time_to_detect_mttd
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (AVG((DATEDIFF(second, incident.started_at, incident.detected_at) / 86400.0)) * 1440)
    description: Mean Time to Detect (MTTD). Time from incident start to detection.
    datatype: Decimal
    ai_context:
      synonyms:
        - MTTD
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/engineering/mean-time-to-detect-mttd."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"mean_time_to_detect_mttd","gasp_version":"1","unit":"minutes","formula":"(avg(field.detected_at - field.started_at)) * 1440"}'
  - name: gasp_mean_time_to_acknowledge_mtta
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (AVG((DATEDIFF(second, incident.detected_at, incident.acknowledged_at) / 86400.0)) * 1440)
    description: Mean Time to Acknowledge (MTTA). Time from alert to human acknowledgment.
    datatype: Decimal
    ai_context:
      synonyms:
