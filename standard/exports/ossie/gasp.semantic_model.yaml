    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/people/total-headcount. Reads the employee snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
