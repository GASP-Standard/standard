    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/projects-per-consultant. Staged (period bound in filter): gasp_staged_gasp_projects_per_consultant holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
