    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/people/headcount-growth-rate. Staged (at period_start): gasp_staged_gasp_headcount_growth_rate holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"headcount_growth_rate","gasp_version":"1","unit":"percent","formula":"(metric.total_headcount at period_end - metric.total_headcount at period_start) / metric.total_headcount at period_start","staged":true}'
  - name: gasp_employee_turnover
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_employee_turnover.value)
    description: Employee Turnover Rate. Percentage of employees who left in a period.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/people/employee-turnover-rate. Staged (at period_start): gasp_staged_gasp_employee_turnover holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"employee_turnover","gasp_version":"1","unit":"percent","formula":"count_distinct(field.employee_id where field.termination_date >= period_start and field.termination_date <= period_end) / ((metric.total_headcount at period_start + metric.total_headcount at period_end) / 2)","staged":true}'
  - name: gasp_employee_turnover_by_department
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_employee_turnover_by_department.value)
    description: Employee Turnover Rate, by_department breakdown. Percentage of employees who left in a period.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/people/employee-turnover-rate. Broken down by department: report one value per department. Staged (at period_start): gasp_staged_gasp_employee_turnover_by_department holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"employee_turnover","gasp_version":"1","variant":"by_department","unit":"percent","formula":"count_distinct(field.employee_id where field.termination_date >= period_start and field.termination_date <= period_end) / ((metric.total_headcount at period_start + metric.total_headcount at period_end) / 2)","gasp_breakdown":"department","staged":true}'
  - name: gasp_voluntary_turnover_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_voluntary_turnover_rate.value)
    description: Voluntary Turnover Rate. Turnover due to employee choice (resignations).
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/people/voluntary-turnover-rate. Staged (at period_start): gasp_staged_gasp_voluntary_turnover_rate holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"voluntary_turnover_rate\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"count_distinct(field.employee_id where field.termination_type = 'voluntary' and in_period(field.termination_date)) / ((metric.total_headcount at period_start + metric.total_headcount at period_end) / 2)\",\"staged\":true}"
  - name: gasp_voluntary_turnover_rate_by_department
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_voluntary_turnover_rate_by_department.value)
    description: Voluntary Turnover Rate, by_department breakdown. Turnover due to employee choice (resignations).
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/people/voluntary-turnover-rate. Broken down by department: report one value per department. Staged (at period_start): gasp_staged_gasp_voluntary_turnover_rate_by_department holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
