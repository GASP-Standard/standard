    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/revops/quote-accuracy. Staged (period bound in filter): gasp_staged_gasp_quote_accuracy holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"quote_accuracy","gasp_version":"1","unit":"percent","formula":"count_distinct(field.quote_id where in_period(field.quote_sent_at) and field.revision_count = 0) / count_distinct(field.quote_id where in_period(field.quote_sent_at))","staged":true}'
  - name: gasp_discount_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_discount_rate.value)
    description: Discount Rate. Average discount applied to deals.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/revops/discount-rate. Staged (period bound in filter): gasp_staged_gasp_discount_rate holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"discount_rate","gasp_version":"1","unit":"percent","formula":"(sum(field.list_price where in_period(field.quote_sent_at)) - sum(field.quoted_price where in_period(field.quote_sent_at))) / sum(field.list_price where in_period(field.quote_sent_at))","staged":true}'
  - name: gasp_order_to_activation_time
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_order_to_activation_time.value)
    description: Order-to-Activation Time. Time from signed order to customer activation/provisioning.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/revops/order-to-activation-time. Staged (period bound in filter): gasp_staged_gasp_order_to_activation_time holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"order_to_activation_time","gasp_version":"1","unit":"days","formula":"median(field.activation_date - field.acquisition_date where in_period(field.activation_date))","staged":true}'
  - name: gasp_order_processing_time
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_order_processing_time.value)
    description: Order Processing Time. Time to process an order through internal systems.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/revops/order-processing-time. Staged (period bound in filter): gasp_staged_gasp_order_processing_time holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"order_processing_time","gasp_version":"1","unit":"hours","formula":"(median(field.order_completed_at - field.order_received_at where in_period(field.order_completed_at))) * 24","staged":true}'
  - name: gasp_order_error_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_order_error_rate.value)
    description: Order Error Rate. Percentage of orders with processing errors.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/revops/order-error-rate. Staged (period bound in filter): gasp_staged_gasp_order_error_rate holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"order_error_rate","gasp_version":"1","unit":"percent","formula":"count_distinct(field.order_id where in_period(field.order_completed_at) and field.has_error = true) / count_distinct(field.order_id where in_period(field.order_completed_at))","staged":true}'
  - name: gasp_billing_accuracy
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_billing_accuracy.value)
    description: Billing Accuracy. Percentage of invoices generated correctly on first attempt.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/revops/billing-accuracy. Staged (period bound in filter): gasp_staged_gasp_billing_accuracy holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"billing_accuracy","gasp_version":"1","unit":"percent","formula":"count_distinct(field.invoice_id where in_period(field.invoice_date) and field.invoice_corrected = false) / count_distinct(field.invoice_id where in_period(field.invoice_date))","staged":true}'
  - name: gasp_invoice_cycle_time
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_invoice_cycle_time.value)
    description: Invoice Cycle Time. Time from billing event to invoice delivery.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/revops/invoice-cycle-time. Staged (period bound in filter): gasp_staged_gasp_invoice_cycle_time holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"invoice_cycle_time","gasp_version":"1","unit":"days","formula":"median(field.invoice_date - field.billing_trigger_date where in_period(field.invoice_date))","staged":true}'
  - name: gasp_billing_disputes
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_billing_disputes.value)
    description: Billing Disputes. Percentage of invoices disputed by customers.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/revops/billing-disputes. Staged (period bound in filter): gasp_staged_gasp_billing_disputes holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"billing_disputes","gasp_version":"1","unit":"percent","formula":"count_distinct(field.invoice_id where in_period(field.invoice_date) and field.invoice_disputed = true) / count_distinct(field.invoice_id where in_period(field.invoice_date))","staged":true}'
  - name: gasp_billing_disputes_by_payment_status
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_billing_disputes_by_payment_status.value)
    description: Billing Disputes, by_payment_status breakdown. Percentage of invoices disputed by customers.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/revops/billing-disputes. Broken down by payment_status: report one value per payment_status. Staged (period bound in filter): gasp_staged_gasp_billing_disputes_by_payment_status holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"billing_disputes","gasp_version":"1","variant":"by_payment_status","unit":"percent","formula":"count_distinct(field.invoice_id where in_period(field.invoice_date) and field.invoice_disputed = true) / count_distinct(field.invoice_id where in_period(field.invoice_date))","gasp_breakdown":"payment_status","staged":true}'
  - name: gasp_credit_memo_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_credit_memo_rate.value)
    description: Credit Memo Rate. Percentage of invoices requiring credit memos.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/revops/credit-memo-rate. Staged (period bound in filter): gasp_staged_gasp_credit_memo_rate holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"credit_memo_rate","gasp_version":"1","unit":"percent","formula":"count_distinct(field.invoice_id where in_period(field.invoice_date) and field.credit_memo_count > 0) / count_distinct(field.invoice_id where in_period(field.invoice_date))","staged":true}'
  - name: gasp_dso
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_dso.value)
    description: Days Sales Outstanding (DSO). Average days to collect payment after invoicing.
    datatype: Decimal
    ai_context:
      synonyms:
        - DSO
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/revops/days-sales-outstanding-dso. Staged (period_days): gasp_staged_gasp_dso holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"dso","gasp_version":"1","unit":"days","formula":"sum(field.accounts_receivable) at period_end / metric.revenue_gaap * period_days","staged":true}'
  - name: gasp_collection_effectiveness_index_cei
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_collection_effectiveness_index_cei.value)
    description: Collection Effectiveness Index (CEI). How effective collections are at collecting receivables.
    datatype: Decimal
    ai_context:
      synonyms:
        - CEI
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/revops/collection-effectiveness-index-cei. Staged (at period_start): gasp_staged_gasp_collection_effectiveness_index_cei holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"collection_effectiveness_index_cei","gasp_version":"1","unit":"percent","formula":"(sum(field.accounts_receivable) at period_start + sum(field.invoice_amount where in_period(field.invoice_date)) - sum(field.accounts_receivable) at period_end) / (sum(field.accounts_receivable) at period_start + sum(field.invoice_amount where in_period(field.invoice_date)) - sum(field.outstanding_amount where (field.snapshot_date - field.invoice_date) <= 30) at period_end)","staged":true}'
  - name: gasp_aging_buckets
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_aging_buckets.value)
    description: Aging Buckets. Distribution of receivables by age.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/revops/aging-buckets. Broken down by bucket: report one value per bucket. Staged (bucket): gasp_staged_gasp_aging_buckets holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"aging_buckets","gasp_version":"1","unit":"percent","formula":"sum(field.outstanding_amount) / total(sum(field.outstanding_amount))","gasp_breakdown":"bucket","staged":true}'
  - name: gasp_bad_debt_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(SUM(financials.bad_debt_expense) AS DECIMAL) / NULLIF((SUM(financials.revenue)), 0))
    description: Bad Debt Rate. Percentage of revenue written off as uncollectable.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/finance/bad-debt-rate."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"bad_debt_rate","gasp_version":"1","unit":"percent","formula":"sum(field.bad_debt_expense) / metric.revenue_gaap"}'
  - name: gasp_payment_method_distribution
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_payment_method_distribution.value)
    description: Payment Method Distribution. Breakdown of payments by method.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/revops/payment-method-distribution. Broken down by payment_method: report one value per payment_method. Staged (total): gasp_staged_gasp_payment_method_distribution holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"payment_method_distribution","gasp_version":"1","unit":"percent","formula":"sum(field.invoice_amount where in_period(field.invoice_date)) / total(sum(field.invoice_amount where in_period(field.invoice_date) and field.payment_method is not null))","gasp_breakdown":"payment_method","staged":true}'
  - name: gasp_recognized_vs_billed
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(SUM(revenue_schedule.recognized_revenue) AS DECIMAL) / NULLIF(SUM(revenue_schedule.billed_amount), 0))
    description: Recognized vs Billed. Ratio of recognized revenue to billed revenue.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/revops/recognized-vs-billed."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"recognized_vs_billed","gasp_version":"1","unit":"ratio","formula":"sum(field.recognized_revenue) / sum(field.billed_amount)"}'
  - name: gasp_deferred_revenue_balance
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_deferred_revenue_balance.value)
    description: Deferred Revenue Balance. Revenue billed but not yet recognized. A balance of cumulative billings less cumulative recognized revenue, independent of when cash is received.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/revops/deferred-revenue-balance. Staged (to_date): gasp_staged_gasp_deferred_revenue_balance holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"deferred_revenue_balance","gasp_version":"1","unit":"currency","formula":"sum(field.billed_amount) to_date - sum(field.recognized_revenue) to_date","staged":true}'
  - name: gasp_unbilled_revenue
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(GREATEST((revenue_schedule.recognized_revenue - revenue_schedule.billed_amount), 0))
    description: Unbilled Revenue. Revenue recognized but not yet invoiced.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/revops/unbilled-revenue."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"unbilled_revenue","gasp_version":"1","unit":"currency","formula":"sum(max(field.recognized_revenue - field.billed_amount, 0))"}'
  - name: gasp_revenue_recognition_accuracy
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(SUM(CASE WHEN revenue_schedule.recognition_correct = TRUE THEN revenue_schedule.recognized_revenue ELSE 0 END) AS DECIMAL) / NULLIF(SUM(revenue_schedule.recognized_revenue), 0))
    description: Revenue Recognition Accuracy. Percentage of revenue correctly recognized per ASC 606.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/revops/revenue-recognition-accuracy."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"revenue_recognition_accuracy","gasp_version":"1","unit":"percent","formula":"sum(field.recognized_revenue where field.recognition_correct = true) / sum(field.recognized_revenue)"}'
  - name: gasp_renewal_notification_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_renewal_notification_rate.value)
    description: Renewal Notification Rate. Percentage of renewals where customer was notified on time.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/revops/renewal-notification-rate. Staged (period bound in filter): gasp_staged_gasp_renewal_notification_rate holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"renewal_notification_rate","gasp_version":"1","unit":"percent","formula":"count_distinct(field.subscription_id where in_period(field.contract_end) and field.renewal_notified_on_time = true) / count_distinct(field.subscription_id where in_period(field.contract_end))","staged":true}'
  - name: gasp_auto_renewal_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_auto_renewal_rate.value)
    description: Auto-Renewal Rate. Percentage of renewals processed automatically.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/revops/auto-renewal-rate. Staged (period bound in filter): gasp_staged_gasp_auto_renewal_rate holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"auto_renewal_rate","gasp_version":"1","unit":"percent","formula":"count_distinct(field.subscription_id where in_period(field.contract_end) and field.auto_renewed = true) / count_distinct(field.subscription_id where in_period(field.contract_end))","staged":true}'
  - name: gasp_renewal_processing_time
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_renewal_processing_time.value)
    description: Renewal Processing Time. Time to process a renewal from trigger to completion.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/revops/renewal-processing-time. Staged (period bound in filter): gasp_staged_gasp_renewal_processing_time holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"renewal_processing_time","gasp_version":"1","unit":"days","formula":"median(field.renewal_complete_date - field.renewal_trigger_date where in_period(field.contract_end))","staged":true}'
  - name: gasp_system_sync_accuracy
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(CASE WHEN crm_record.sync_status = 'matched' THEN crm_record.sync_status END) AS DECIMAL) / NULLIF(COUNT(crm_record.sync_status), 0))
    description: System Sync Accuracy. Data consistency across RevOps systems (CRM, billing, ERP).
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/revops/system-sync-accuracy. Reads the crm_record snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"system_sync_accuracy\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"count(field.sync_status where field.sync_status = 'matched') / count(field.sync_status)\"}"
  - name: gasp_data_completeness
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(SUM(crm_record.populated_field_count) AS DECIMAL) / NULLIF(SUM(crm_record.required_field_count), 0))
    description: Data Completeness. Percentage of required fields populated in RevOps systems.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/revops/data-completeness. Reads the crm_record snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"data_completeness","gasp_version":"1","unit":"percent","formula":"sum(field.populated_field_count) / sum(field.required_field_count)"}'
  - name: gasp_daily_active_users_dau
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_daily_active_users_dau.value)
    description: Daily Active Users (DAU). Unique users who performed a meaningful action in the product on a given day.
    datatype: Integer
    ai_context:
      synonyms:
        - DAU
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/daily-active-users-dau. Staged (window): gasp_staged_gasp_daily_active_users_dau holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"daily_active_users_dau\",\"gasp_version\":\"1\",\"unit\":\"count\",\"formula\":\"window(count_distinct(field.user_id where field.product_event_type = 'qualifying'), 1 day)\",\"staged\":true}"
  - name: gasp_weekly_active_users_wau
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_weekly_active_users_wau.value)
    description: Weekly Active Users (WAU). Unique users who performed a meaningful action in the product within a 7-day period.
    datatype: Integer
    ai_context:
      synonyms:
        - WAU
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/weekly-active-users-wau. Staged (window): gasp_staged_gasp_weekly_active_users_wau holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"weekly_active_users_wau\",\"gasp_version\":\"1\",\"unit\":\"count\",\"formula\":\"window(count_distinct(field.user_id where field.product_event_type = 'qualifying'), 7 day)\",\"staged\":true}"
  - name: gasp_monthly_active_users_mau
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_monthly_active_users_mau.value)
    description: Monthly Active Users (MAU). Unique users who performed a meaningful action in the product within a 30-day period.
    datatype: Integer
    ai_context:
      synonyms:
        - MAU
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/monthly-active-users-mau. Staged (window): gasp_staged_gasp_monthly_active_users_mau holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"monthly_active_users_mau\",\"gasp_version\":\"1\",\"unit\":\"count\",\"formula\":\"window(count_distinct(field.user_id where field.product_event_type = 'qualifying'), 30 day)\",\"staged\":true}"
  - name: gasp_dau_mau
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_dau_mau.value)
    description: DAU/MAU Ratio (Stickiness). The ratio of daily to monthly active users, indicating how often users return.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/daumau-ratio-stickiness. Staged (window): gasp_staged_gasp_dau_mau holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"dau_mau","gasp_version":"1","unit":"percent","formula":"metric.daily_active_users_dau / metric.monthly_active_users_mau","staged":true}'
  - name: gasp_waumau_ratio
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_waumau_ratio.value)
    description: WAU/MAU Ratio. Weekly to monthly active user ratio.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/waumau-ratio. Staged (window): gasp_staged_gasp_waumau_ratio holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"waumau_ratio","gasp_version":"1","unit":"percent","formula":"metric.weekly_active_users_wau / metric.monthly_active_users_mau","staged":true}'
  - name: gasp_active_accounts
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: COUNT(DISTINCT CASE WHEN product_event.product_event_type = 'qualifying' THEN product_event.customer_id END)
    description: Active Accounts. Customer accounts with at least one active user in the period.
    datatype: Integer
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/active-accounts."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"active_accounts\",\"gasp_version\":\"1\",\"unit\":\"count\",\"formula\":\"count_distinct(field.customer_id where field.product_event_type = 'qualifying')\"}"
  - name: gasp_activation_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_activation_rate.value)
    description: Onboarding-to-Active Rate (Activation Rate). Percentage of onboarded customers who become actively engaged.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/onboarding/onboarding-to-active-rate-activation-rate. Staged (period bound in filter): gasp_staged_gasp_activation_rate holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"activation_rate","gasp_version":"1","unit":"percent","formula":"count_distinct(field.customer_id where in_period(field.onboarding_completion_date) and field.activation_date is not null) / count_distinct(field.customer_id where in_period(field.onboarding_completion_date))","staged":true}'
  - name: gasp_feature_adoption
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(DISTINCT CASE WHEN product_event.feature_id IS NOT NULL THEN product_event.user_id END) AS DECIMAL) / NULLIF(COUNT(DISTINCT CASE WHEN product_event.product_event_type = 'qualifying' THEN product_event.user_id END), 0))
    description: Feature Adoption Rate. Percentage of users/accounts using a specific feature.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/feature-adoption-rate."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"feature_adoption\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"count_distinct(field.user_id where field.feature_id is not null) / count_distinct(field.user_id where field.product_event_type = 'qualifying')\"}"
  - name: gasp_core_feature_adoption
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(DISTINCT CASE WHEN user.core_features_adopted = TRUE THEN user.user_id END) AS DECIMAL) / NULLIF(COUNT(DISTINCT CASE WHEN product_event.product_event_type = 'qualifying' THEN product_event.user_id END), 0))
    description: Core Feature Adoption. Percentage of users using the core features that define the product.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/core-feature-adoption. Reads the user snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"core_feature_adoption\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"count_distinct(field.user_id where field.core_features_adopted = true) / count_distinct(field.user_id where field.product_event_type = 'qualifying')\"}"
  - name: gasp_feature_depth
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(SUM(product_event.usage_count) AS DECIMAL) / NULLIF(COUNT(DISTINCT CASE WHEN product_event.usage_count > 0 THEN product_event.user_id END), 0))
    description: Feature Depth. How extensively users engage with features (not just whether they use them).
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/feature-depth."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"feature_depth","gasp_version":"1","unit":"ratio","formula":"sum(field.usage_count) / count_distinct(field.user_id where field.usage_count > 0)"}'
  - name: gasp_time_to_feature_adoption
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_time_to_feature_adoption.value)
    description: Time to Feature Adoption. Time from signup/activation to using a specific feature.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/time-to-feature-adoption. Staged (period bound in filter): gasp_staged_gasp_time_to_feature_adoption holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"time_to_feature_adoption","gasp_version":"1","unit":"days","formula":"median(field.first_use_date - field.signup_date where in_period(field.first_use_date))","staged":true}'
  - name: gasp_breadth_of_adoption
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_breadth_of_adoption.value)
    description: Breadth of Adoption. Average number of features used per account.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/breadth-of-adoption. Staged (distinct pair): gasp_staged_gasp_breadth_of_adoption holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"breadth_of_adoption","gasp_version":"1","unit":"ratio","formula":"count_distinct(field.customer_id, field.feature_id) / metric.active_accounts","staged":true}'
  - name: gasp_session_frequency
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(DISTINCT product_event.session_id) AS DECIMAL) / NULLIF(COUNT(DISTINCT CASE WHEN product_event.product_event_type = 'qualifying' THEN product_event.user_id END), 0))
    description: Session Frequency. Average number of sessions per user per period.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/session-frequency."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"session_frequency\",\"gasp_version\":\"1\",\"unit\":\"ratio\",\"formula\":\"count_distinct(field.session_id) / count_distinct(field.user_id where field.product_event_type = 'qualifying')\"}"
  - name: gasp_session_duration
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: AVG(product_event.session_duration)
    description: Session Duration. Average time spent per session.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/session-duration."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"session_duration","gasp_version":"1","unit":"minutes","formula":"avg(field.session_duration)"}'
  - name: gasp_time_in_product
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(SUM(product_event.session_duration) AS DECIMAL) / NULLIF(COUNT(DISTINCT user.user_id), 0))
    description: Time in Product. Total time spent in product per user per period.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/time-in-product. Reads the user snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"time_in_product","gasp_version":"1","unit":"minutes","formula":"sum(field.session_duration) / count_distinct(field.user_id)"}'
  - name: gasp_actions_per_session
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(SUM(product_event.usage_count) AS DECIMAL) / NULLIF(COUNT(DISTINCT product_event.session_id), 0))
    description: Actions per Session. Average number of meaningful actions per session.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/actions-per-session."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"actions_per_session","gasp_version":"1","unit":"ratio","formula":"sum(field.usage_count) / count_distinct(field.session_id)"}'
  - name: gasp_pqas
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: COUNT(DISTINCT CASE WHEN customer.criteria_met = TRUE THEN customer.customer_id END)
    description: Product Qualified Accounts (PQAs). Accounts that have demonstrated product engagement indicating sales-readiness.
    datatype: Integer
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/product-qualified-accounts-pqas. Reads the customer snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"pqas","gasp_version":"1","unit":"count","formula":"count_distinct(field.customer_id where field.criteria_met = true) at period_end"}'
  - name: gasp_user_retention_day_n
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_user_retention_day_n.value)
    description: User Retention (Day N). Percentage of users who return on day N after signup.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/user-retention-day-n. Staged (all_time): gasp_staged_gasp_user_retention_day_n holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"user_retention_day_n\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"all_time(count_distinct(field.user_id where field.product_event_type = 'qualifying' and in_period(field.signup_date) and (field.event_date - field.signup_date) = 30)) / count_distinct(field.user_id where in_period(field.signup_date))\",\"staged\":true}"
  - name: gasp_cohort_retention
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_cohort_retention.value)
    description: Cohort Retention. Retention tracked by signup cohort over time.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/cohort-retention. Staged (all_time): gasp_staged_gasp_cohort_retention holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"cohort_retention\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"all_time(count_distinct(field.user_id where field.product_event_type = 'qualifying' and in_period(field.signup_date) and (field.event_date - field.signup_date) >= 49 and (field.event_date - field.signup_date) < 56)) / count_distinct(field.user_id where in_period(field.signup_date))\",\"staged\":true}"
  - name: gasp_resurrection_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_resurrection_rate.value)
    description: Resurrection Rate. Percentage of churned/dormant users who return.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/resurrection-rate. Staged (at period_start): gasp_staged_gasp_resurrection_rate holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"resurrection_rate\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"count_distinct(field.user_id where field.product_event_type = 'reactivation') / count_distinct(field.user_id where field.user_status = 'dormant') at period_start\",\"staged\":true}"
  - name: gasp_release_frequency
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: COUNT(DISTINCT release.release_id)
    description: Release Frequency. How often new releases are shipped to customers.
    datatype: Integer
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/release-frequency."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"release_frequency","gasp_version":"1","unit":"count","formula":"count_distinct(field.release_id)"}'
  - name: gasp_feature_delivery_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_feature_delivery_rate.value)
    description: Feature Delivery Rate. Percentage of planned features delivered on schedule.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/feature-delivery-rate. Staged (period bound in filter): gasp_staged_gasp_feature_delivery_rate holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"feature_delivery_rate","gasp_version":"1","unit":"percent","formula":"count_distinct(field.feature_id where in_period(field.planned_date) and field.actual_date <= field.planned_date) / count_distinct(field.feature_id where in_period(field.planned_date))","staged":true}'
  - name: gasp_roadmap_completion
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(DISTINCT CASE WHEN roadmap_item.roadmap_item_completed = TRUE THEN roadmap_item.roadmap_item_id END) AS DECIMAL) / NULLIF(COUNT(DISTINCT roadmap_item.roadmap_item_id), 0))
    description: Roadmap Completion. Percentage of roadmap items completed in the period.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/roadmap-completion. Reads the roadmap_item snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"roadmap_completion","gasp_version":"1","unit":"percent","formula":"count_distinct(field.roadmap_item_id where field.roadmap_item_completed = true) / count_distinct(field.roadmap_item_id)"}'
  - name: gasp_time_to_market
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_time_to_market.value)
    description: Time to Market. Time from feature concept to production release.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/time-to-market. Staged (period bound in filter): gasp_staged_gasp_time_to_market holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"time_to_market","gasp_version":"1","unit":"days","formula":"median(field.release_date - field.feature_created_date where in_period(field.release_date))","staged":true}'
  - name: gasp_error_rate_user_facing
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(CASE WHEN product_event.product_event_type = 'error' THEN product_event.event_id END) AS DECIMAL) / NULLIF(COUNT(CASE WHEN product_event.product_event_type IN ('action', 'error') THEN product_event.event_id END), 0))
    description: Error Rate (User-Facing). Percentage of user actions that result in errors.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/error-rate-user-facing."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"error_rate_user_facing\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"count(field.event_id where field.product_event_type = 'error') / count(field.event_id where field.product_event_type in ('action', 'error'))\"}"
  - name: gasp_bug_escape_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(DISTINCT CASE WHEN (issue.issue_type = 'bug' AND issue.issue_environment = 'production') THEN issue.issue_id END) AS DECIMAL) / NULLIF(COUNT(DISTINCT CASE WHEN issue.issue_type = 'bug' THEN issue.issue_id END), 0))
    description: Bug Escape Rate. Bugs found in production vs found in testing.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/bug-escape-rate."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"bug_escape_rate\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"count_distinct(field.issue_id where field.issue_type = 'bug' and field.issue_environment = 'production') / count_distinct(field.issue_id where field.issue_type = 'bug')\"}"
  - name: gasp_user_reported_issues
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: COUNT(DISTINCT CASE WHEN (issue.issue_type = 'bug' AND issue.issue_source = 'user_report') THEN issue.issue_id END)
    description: User-Reported Issues. Number of bugs/issues reported by users.
    datatype: Integer
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/user-reported-issues."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"user_reported_issues\",\"gasp_version\":\"1\",\"unit\":\"count\",\"formula\":\"count_distinct(field.issue_id where field.issue_type = 'bug' and field.issue_source = 'user_report')\"}"
  - name: gasp_feature_request_volume
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: COUNT(DISTINCT CASE WHEN issue.issue_type = 'feature_request' THEN issue.issue_id END)
    description: Feature Request Volume. Number of feature requests received.
    datatype: Integer
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/feature-request-volume."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"feature_request_volume\",\"gasp_version\":\"1\",\"unit\":\"count\",\"formula\":\"count_distinct(field.issue_id where field.issue_type = 'feature_request')\"}"
  - name: gasp_uptime
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_uptime.value)
    description: Uptime (Availability). The percentage of time the service is operational.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/engineering/uptime-availability. Staged (period_days): gasp_staged_gasp_uptime holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"uptime","gasp_version":"1","unit":"percent","formula":"1 - sum(field.downtime_minutes) / (period_days * 1440)","staged":true}'
  - name: gasp_sla_adherence
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(CASE WHEN service_metrics.sla_met = TRUE THEN service_metrics.service_id END) AS DECIMAL) / NULLIF(COUNT(service_metrics.service_id), 0))
    description: SLA Adherence. Percentage of time SLA commitments were met.
    datatype: Decimal
    ai_context:
      synonyms:
        - SLA
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/engineering/sla-adherence."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"sla_adherence","gasp_version":"1","unit":"percent","formula":"count(field.service_id where field.sla_met = true) / count(field.service_id)"}'
  - name: gasp_error_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(SUM(service_metrics.error_count) AS DECIMAL) / NULLIF(SUM(service_metrics.request_count), 0))
    description: Error Rate. Percentage of requests that result in errors.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/engineering/error-rate."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"error_rate","gasp_version":"1","unit":"percent","formula":"sum(field.error_count) / sum(field.request_count)"}'
  - name: gasp_latency_response_time
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: PERCENTILE_CONT(0.95) WITHIN GROUP (ORDER BY service_metrics.response_time_ms)
    description: Latency (Response Time). Time taken to respond to requests.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/engineering/latency-response-time."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"latency_response_time","gasp_version":"1","unit":"milliseconds","formula":"percentile(field.response_time_ms, 0.95)"}'
  - name: gasp_latency_response_time_p50
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY service_metrics.response_time_ms)
    description: Latency (Response Time), p50 variant. Time taken to respond to requests.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/engineering/latency-response-time."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"latency_response_time","gasp_version":"1","variant":"p50","unit":"milliseconds","formula":"percentile(field.response_time_ms, 0.5)"}'
  - name: gasp_latency_response_time_p99
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: PERCENTILE_CONT(0.99) WITHIN GROUP (ORDER BY service_metrics.response_time_ms)
    description: Latency (Response Time), p99 variant. Time taken to respond to requests.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/engineering/latency-response-time."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"latency_response_time","gasp_version":"1","variant":"p99","unit":"milliseconds","formula":"percentile(field.response_time_ms, 0.99)"}'
  - name: gasp_incident_count
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: COUNT(DISTINCT incident.incident_id)
    description: Incident Count. Number of incidents in a period.
    datatype: Integer
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/engineering/incident-count."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"incident_count","gasp_version":"1","unit":"count","formula":"count_distinct(field.incident_id)"}'
  - name: gasp_incident_count_by_severity
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: COUNT(DISTINCT incident.incident_id)
    description: Incident Count, by_severity breakdown. Number of incidents in a period.
    datatype: Integer
    ai_context:
