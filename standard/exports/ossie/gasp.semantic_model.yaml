        data: "{\"gasp_id\":\"cost_per_onboarding\",\"gasp_version\":\"1\",\"unit\":\"currency\",\"formula\":\"sum(field.cost where field.cost_function = 'onboarding') / count_distinct(field.onboarding_id where in_period(field.onboarding_completion_date))\",\"staged\":true}"
  - name: gasp_time_spent_per_onboarding
