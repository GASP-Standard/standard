        data: "{\"gasp_id\":\"partner_influenced_revenue\",\"gasp_version\":\"1\",\"unit\":\"currency\",\"formula\":\"sum(field.opportunity_amount where field.partner_id is not null and field.opportunity_stage = 'closed_won' and in_period(field.close_date))\",\"staged\":true}"
  - name: gasp_channel_revenue_percentage
