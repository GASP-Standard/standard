    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/onboarding/onboardings-per-resource. Staged (period bound in filter): gasp_staged_gasp_onboardings_per_resource holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"onboardings_per_resource","gasp_version":"1","unit":"ratio","formula":"count_distinct(field.onboarding_id where in_period(field.onboarding_completion_date)) / count_distinct(field.resource_id where in_period(field.onboarding_completion_date))","staged":true}'
  - name: gasp_cost_per_onboarding
    expression:
      dialects:
