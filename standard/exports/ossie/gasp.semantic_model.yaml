  - name: gasp_day_30_retention_post_onboarding
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(DISTINCT CASE WHEN ((customer.onboarding_completion_date IS NOT NULL AND customer.customer_status = 'active') AND DATEDIFF(day, customer.onboarding_completion_date, customer.last_active_date) >= 30) THEN customer.customer_id END) AS DECIMAL) / NULLIF(COUNT(DISTINCT CASE WHEN customer.onboarding_completion_date IS NOT NULL THEN customer.customer_id END), 0))
    description: 30-Day Retention (Post-Onboarding). Percentage of customers still active 30 days after onboarding completion.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/onboarding/30-day-retention-post-onboarding. Reads the customer snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"day_30_retention_post_onboarding\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"count_distinct(field.customer_id where field.onboarding_completion_date is not null and field.customer_status = 'active' and (field.last_active_date - field.onboarding_completion_date) >= 30) / count_distinct(field.customer_id where field.onboarding_completion_date is not null)\"}"
  - name: gasp_feature_adoption_at_go_live
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(DISTINCT CASE WHEN product_event.usage_count > 0 THEN product_event.feature_id END) AS DECIMAL) / NULLIF(COUNT(DISTINCT feature.feature_id), 0))
    description: Feature Adoption at Go-Live. Percentage of available features being used at go-live.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/onboarding/feature-adoption-at-go-live. Reads the feature snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"feature_adoption_at_go_live","gasp_version":"1","unit":"percent","formula":"count_distinct(field.feature_id where field.usage_count > 0) / count_distinct(field.feature_id)"}'
  - name: gasp_total_headcount
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: COUNT(DISTINCT CASE WHEN employee.employee_status = 'active' THEN employee.employee_id END)
    description: Total Headcount. Total number of employees.
