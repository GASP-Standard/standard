      dialects:
        - dialect: OSSIE_SQL_2026
          expression: MEDIAN(CASE WHEN onboarding_milestone.onboarding_milestone = 'first_value' THEN DATEDIFF(day, onboarding_milestone.contract_start, onboarding_milestone.milestone_date) END)
