    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/professional-services/time-to-start. Staged (period bound in filter): gasp_staged_gasp_time_to_start holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"time_to_start","gasp_version":"1","unit":"days","formula":"median(field.project_start_date - field.close_date where in_period(field.project_start_date))","staged":true}'
  - name: gasp_ticket_volume
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: COUNT(DISTINCT ticket.ticket_id)
    description: Ticket Volume. Total number of support tickets received in a period.
    datatype: Integer
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/support/ticket-volume."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"ticket_volume","gasp_version":"1","unit":"count","formula":"count_distinct(field.ticket_id)"}'
  - name: gasp_ticket_volume_by_ticket_type
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: COUNT(DISTINCT ticket.ticket_id)
    description: Ticket Volume, by_ticket_type breakdown. Total number of support tickets received in a period.
    datatype: Integer
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/support/ticket-volume. Broken down by ticket_type: report one value per ticket_type by grouping on the ticket_type field of each dataset the expression reads."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"ticket_volume","gasp_version":"1","variant":"by_ticket_type","unit":"count","formula":"count_distinct(field.ticket_id)","gasp_breakdown":"ticket_type"}'
  - name: gasp_tickets_per_customer
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST((COUNT(DISTINCT ticket.ticket_id)) AS DECIMAL) / NULLIF(COUNT(DISTINCT CASE WHEN customer.customer_status = 'active' THEN customer.customer_id END), 0))
    description: Tickets per Customer. Average tickets created per active customer.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/support/tickets-per-customer. Reads the customer snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"tickets_per_customer\",\"gasp_version\":\"1\",\"unit\":\"ratio\",\"formula\":\"metric.ticket_volume / count_distinct(field.customer_id where field.customer_status = 'active') at period_end\"}"
  - name: gasp_ticket_backlog
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_ticket_backlog.value)
    description: Ticket Backlog. Number of open tickets awaiting resolution.
    datatype: Integer
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/support/ticket-backlog. Staged (to_date): gasp_staged_gasp_ticket_backlog holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"ticket_backlog\",\"gasp_version\":\"1\",\"unit\":\"count\",\"formula\":\"count_distinct(field.ticket_id where field.ticket_status in ('open', 'pending')) at period_end\",\"staged\":true}"
  - name: gasp_ticket_distribution_by_type
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_ticket_distribution_by_type.value)
    description: Ticket Distribution by Type. Breakdown of tickets by category.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/support/ticket-distribution-by-type. Broken down by ticket_type: report one value per ticket_type. Staged (total): gasp_staged_gasp_ticket_distribution_by_type holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"ticket_distribution_by_type","gasp_version":"1","unit":"percent","formula":"count_distinct(field.ticket_id) / total(metric.ticket_volume)","gasp_breakdown":"ticket_type","staged":true}'
  - name: gasp_frt
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (MEDIAN((DATEDIFF(second, ticket.created_at, ticket.first_response_at) / 86400.0)) * 1440)
    description: First Response Time (FRT). Time from ticket creation to first human response.
    datatype: Decimal
    ai_context:
      synonyms:
        - FRT
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/support/first-response-time-frt."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"frt","gasp_version":"1","unit":"minutes","formula":"(median(field.first_response_at - field.created_at)) * 1440"}'
  - name: gasp_first_response_sla_adherence
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(DISTINCT CASE WHEN ticket.first_response_at <= ticket.first_response_due_at THEN ticket.ticket_id END) AS DECIMAL) / NULLIF(COUNT(DISTINCT ticket.ticket_id), 0))
    description: First Response SLA Adherence. Percentage of tickets meeting FRT SLA target.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/support/first-response-sla-adherence."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"first_response_sla_adherence","gasp_version":"1","unit":"percent","formula":"count_distinct(field.ticket_id where field.first_response_at <= field.first_response_due_at) / count_distinct(field.ticket_id)"}'
  - name: gasp_resolution_time_time_to_resolution
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (MEDIAN((DATEDIFF(second, ticket.created_at, ticket.resolved_at) / 86400.0)) * 24)
    description: Resolution Time (Time to Resolution). Time from ticket creation to final resolution.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/support/resolution-time-time-to-resolution."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"resolution_time_time_to_resolution","gasp_version":"1","unit":"hours","formula":"(median(field.resolved_at - field.created_at)) * 24"}'
  - name: gasp_resolution_time_time_to_resolution_by_ticket_type
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (MEDIAN((DATEDIFF(second, ticket.created_at, ticket.resolved_at) / 86400.0)) * 24)
    description: Resolution Time (Time to Resolution), by_ticket_type breakdown. Time from ticket creation to final resolution.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/support/resolution-time-time-to-resolution. Broken down by ticket_type: report one value per ticket_type by grouping on the ticket_type field of each dataset the expression reads."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"resolution_time_time_to_resolution","gasp_version":"1","variant":"by_ticket_type","unit":"hours","formula":"(median(field.resolved_at - field.created_at)) * 24","gasp_breakdown":"ticket_type"}'
  - name: gasp_first_contact_resolution_fcr
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(DISTINCT CASE WHEN ticket.resolved_first_contact = TRUE THEN ticket.ticket_id END) AS DECIMAL) / NULLIF(COUNT(DISTINCT ticket.ticket_id), 0))
    description: First Contact Resolution (FCR). Percentage of tickets resolved in a single interaction.
    datatype: Decimal
    ai_context:
      synonyms:
        - FCR
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/support/first-contact-resolution-fcr."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"first_contact_resolution_fcr","gasp_version":"1","unit":"percent","formula":"count_distinct(field.ticket_id where field.resolved_first_contact = true) / count_distinct(field.ticket_id)"}'
  - name: gasp_resolution_sla_adherence
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(DISTINCT CASE WHEN ticket.resolved_at <= ticket.resolution_due_at THEN ticket.ticket_id END) AS DECIMAL) / NULLIF(COUNT(DISTINCT ticket.ticket_id), 0))
    description: Resolution SLA Adherence. Percentage of tickets resolved within SLA timeframe.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/support/resolution-sla-adherence."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"resolution_sla_adherence","gasp_version":"1","unit":"percent","formula":"count_distinct(field.ticket_id where field.resolved_at <= field.resolution_due_at) / count_distinct(field.ticket_id)"}'
  - name: gasp_reopen_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(DISTINCT CASE WHEN ticket.reopened = TRUE THEN ticket.ticket_id END) AS DECIMAL) / NULLIF(COUNT(DISTINCT CASE WHEN ticket.ticket_status = 'resolved' THEN ticket.ticket_id END), 0))
    description: Reopen Rate. Percentage of resolved tickets that are reopened.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/support/reopen-rate."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"reopen_rate\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"count_distinct(field.ticket_id where field.reopened = true) / count_distinct(field.ticket_id where field.ticket_status = 'resolved')\"}"
  - name: gasp_csat
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(CASE WHEN (survey_response.survey_type = 'customer' AND survey_response.satisfaction_score >= 4) THEN survey_response.satisfaction_score END) AS DECIMAL) / NULLIF(COUNT(CASE WHEN survey_response.survey_type = 'customer' THEN survey_response.satisfaction_score END), 0))
    description: Customer Satisfaction Score (CSAT). Customer rating of support interaction.
    datatype: Decimal
    ai_context:
      synonyms:
        - CSAT
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/support/customer-satisfaction-score-csat."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"csat\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"count(field.satisfaction_score where field.survey_type = 'customer' and field.satisfaction_score >= 4) / count(field.satisfaction_score where field.survey_type = 'customer')\"}"
  - name: gasp_customer_effort_score_ces
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: AVG(survey_response.ces_score)
    description: Customer Effort Score (CES). How easy it was for the customer to get help.
    datatype: Decimal
    ai_context:
      synonyms:
        - CES
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/support/customer-effort-score-ces."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"customer_effort_score_ces","gasp_version":"1","unit":"score","formula":"avg(field.ces_score)"}'
  - name: gasp_customer_effort_score_ces_percent
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(CASE WHEN survey_response.ces_score >= 5 THEN survey_response.ces_score END) AS DECIMAL) / NULLIF(COUNT(survey_response.ces_score), 0))
    description: Customer Effort Score (CES), percent variant. How easy it was for the customer to get help.
    datatype: Decimal
    ai_context:
      synonyms:
        - CES
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/support/customer-effort-score-ces."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"customer_effort_score_ces","gasp_version":"1","variant":"percent","unit":"score","formula":"count(field.ces_score where field.ces_score >= 5) / count(field.ces_score)"}'
  - name: gasp_tickets_per_agent
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(DISTINCT ticket.ticket_id) AS DECIMAL) / NULLIF(COUNT(DISTINCT ticket.agent_id), 0))
    description: Tickets per Agent. Average tickets handled per support agent.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/support/tickets-per-agent."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"tickets_per_agent","gasp_version":"1","unit":"ratio","formula":"count_distinct(field.ticket_id) / count_distinct(field.agent_id)"}'
  - name: gasp_cost_per_ticket
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(SUM(CASE WHEN cost_event.cost_function = 'support' THEN cost_event.cost ELSE 0 END) AS DECIMAL) / NULLIF(COUNT(DISTINCT CASE WHEN ticket.ticket_status = 'resolved' THEN ticket.ticket_id END), 0))
    description: Cost per Ticket. Total support cost divided by tickets handled.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/support/cost-per-ticket."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"cost_per_ticket\",\"gasp_version\":\"1\",\"unit\":\"currency\",\"formula\":\"sum(field.cost where field.cost_function = 'support') / count_distinct(field.ticket_id where field.ticket_status = 'resolved')\"}"
  - name: gasp_self_service_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(SUM(kb_article.deflections) AS DECIMAL) / NULLIF((SUM(kb_article.deflections) + (COUNT(DISTINCT ticket.ticket_id))), 0))
    description: Self-Service Rate (Ticket Deflection). Percentage of support needs resolved through self-service.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/support/self-service-rate-ticket-deflection."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"self_service_rate","gasp_version":"1","unit":"percent","formula":"sum(field.deflections) / (sum(field.deflections) + metric.ticket_volume)"}'
  - name: gasp_logo_retention_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_logo_retention_rate.value)
    description: Logo Retention Rate. The percentage of customers retained over a period.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/customer-success/logo-retention-rate. Staged (at period_start): gasp_staged_gasp_logo_retention_rate holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"logo_retention_rate","gasp_version":"1","unit":"percent","formula":"1 - metric.logo_churn_rate","staged":true}'
  - name: gasp_logo_retention_rate_customer_counts
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_logo_retention_rate_customer_counts.value)
    description: Logo Retention Rate, customer_counts variant. The percentage of customers retained over a period.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/customer-success/logo-retention-rate. Staged (at period_start): gasp_staged_gasp_logo_retention_rate_customer_counts holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"logo_retention_rate\",\"gasp_version\":\"1\",\"variant\":\"customer_counts\",\"unit\":\"percent\",\"formula\":\"(count_distinct(field.customer_id where field.customer_status = 'active') at period_end - count_distinct(field.customer_id where field.event_type = 'new')) / count_distinct(field.customer_id where field.customer_status = 'active') at period_start\",\"staged\":true}"
  - name: gasp_logo_retention_rate_by_segment
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_logo_retention_rate_by_segment.value)
    description: Logo Retention Rate, by_segment breakdown. The percentage of customers retained over a period.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/customer-success/logo-retention-rate. Broken down by segment: report one value per segment. Staged (at period_start): gasp_staged_gasp_logo_retention_rate_by_segment holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"logo_retention_rate","gasp_version":"1","variant":"by_segment","unit":"percent","formula":"1 - metric.logo_churn_rate","gasp_breakdown":"segment","staged":true}'
  - name: gasp_health_score
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: AVG(CASE WHEN customer.customer_status = 'active' THEN customer.composite_score END)
    description: Customer Health Score. A composite score predicting likelihood of retention or churn.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/customer-success/customer-health-score. Reads the customer snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"health_score\",\"gasp_version\":\"1\",\"unit\":\"score\",\"formula\":\"avg(field.composite_score where field.customer_status = 'active') at period_end\"}"
  - name: gasp_health_score_by_segment
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: AVG(CASE WHEN customer.customer_status = 'active' THEN customer.composite_score END)
    description: Customer Health Score, by_segment breakdown. A composite score predicting likelihood of retention or churn.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/customer-success/customer-health-score. Broken down by segment: report one value per segment by grouping on the segment field of each dataset the expression reads. Reads the customer snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"health_score\",\"gasp_version\":\"1\",\"variant\":\"by_segment\",\"unit\":\"score\",\"formula\":\"avg(field.composite_score where field.customer_status = 'active') at period_end\",\"gasp_breakdown\":\"segment\"}"
  - name: gasp_health_score_coverage
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(DISTINCT CASE WHEN customer.composite_score IS NOT NULL THEN customer.customer_id END) AS DECIMAL) / NULLIF(COUNT(DISTINCT CASE WHEN customer.customer_status = 'active' THEN customer.customer_id END), 0))
    description: Health Score Coverage. The percentage of customers with a health score calculated.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/customer-success/health-score-coverage. Reads the customer snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"health_score_coverage\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"count_distinct(field.customer_id where field.composite_score is not null) / count_distinct(field.customer_id where field.customer_status = 'active')\"}"
  - name: gasp_health_score_coverage_by_segment
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(DISTINCT CASE WHEN customer.composite_score IS NOT NULL THEN customer.customer_id END) AS DECIMAL) / NULLIF(COUNT(DISTINCT CASE WHEN customer.customer_status = 'active' THEN customer.customer_id END), 0))
    description: Health Score Coverage, by_segment breakdown. The percentage of customers with a health score calculated.
