        data: "{\"gasp_id\":\"nps_marketing_context\",\"gasp_version\":\"1\",\"unit\":\"score\",\"formula\":\"(count(field.nps_score where field.survey_type = 'prospect' and field.nps_score >= 9) - count(field.nps_score where field.survey_type = 'prospect' and field.nps_score <= 6)) / count(field.nps_score where field.survey_type = 'prospect') * 100\"}"
