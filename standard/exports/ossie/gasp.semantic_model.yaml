      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_onboarding_duration.value)
    description: Onboarding Duration. Time spent actively in onboarding process.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/onboarding/onboarding-duration. Staged (period bound in filter): gasp_staged_gasp_onboarding_duration holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"onboarding_duration","gasp_version":"1","unit":"days","formula":"median(field.onboarding_completion_date - field.onboarding_start_date where in_period(field.onboarding_completion_date))","staged":true}'
  - name: gasp_onboarding_completion
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_onboarding_completion.value)
    description: Onboarding Completion Rate. Percentage of customers who complete the onboarding program.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/onboarding/onboarding-completion-rate. Staged (period bound in filter): gasp_staged_gasp_onboarding_completion holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"onboarding_completion","gasp_version":"1","unit":"percent","formula":"count_distinct(field.onboarding_id where in_period(field.onboarding_completion_date)) / count_distinct(field.onboarding_id where in_period(field.onboarding_start_date))","staged":true}'
  - name: gasp_on_time_completion_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_on_time_completion_rate.value)
    description: On-Time Completion Rate. Percentage of customers completing onboarding within target timeframe.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/onboarding/on-time-completion-rate. Staged (period bound in filter): gasp_staged_gasp_on_time_completion_rate holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"on_time_completion_rate","gasp_version":"1","unit":"percent","formula":"count_distinct(field.onboarding_id where in_period(field.onboarding_completion_date) and field.onboarding_completion_date <= field.target_date) / count_distinct(field.onboarding_id where in_period(field.onboarding_completion_date))","staged":true}'
  - name: gasp_session_attendance_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(CASE WHEN onboarding_session.attendees > 0 THEN onboarding_session.onboarding_session_date END) AS DECIMAL) / NULLIF(COUNT(onboarding_session.onboarding_session_date), 0))
    description: Session Attendance Rate. Percentage of scheduled onboarding sessions attended.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/onboarding/session-attendance-rate."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"session_attendance_rate","gasp_version":"1","unit":"percent","formula":"count(field.onboarding_session_date where field.attendees > 0) / count(field.onboarding_session_date)"}'
  - name: gasp_task_completion_rate
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(SUM(onboarding.steps_completed) AS DECIMAL) / NULLIF(SUM(onboarding.steps_total), 0))
    description: Task Completion Rate. Percentage of assigned onboarding tasks completed by customer.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/onboarding/task-completion-rate. Reads the onboarding snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"task_completion_rate","gasp_version":"1","unit":"percent","formula":"sum(field.steps_completed) / sum(field.steps_total)"}'
  - name: gasp_onboarding_csat
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: (CAST(COUNT(CASE WHEN (survey_response.survey_type = 'onboarding' AND survey_response.satisfaction_score >= 4) THEN survey_response.satisfaction_score END) AS DECIMAL) / NULLIF(COUNT(CASE WHEN survey_response.survey_type = 'onboarding' THEN survey_response.satisfaction_score END), 0))
    description: Onboarding CSAT. Customer satisfaction with the onboarding experience.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/onboarding/onboarding-csat."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"onboarding_csat\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"count(field.satisfaction_score where field.survey_type = 'onboarding' and field.satisfaction_score >= 4) / count(field.satisfaction_score where field.survey_type = 'onboarding')\"}"
  - name: gasp_onboarding_nps
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: ((CAST((COUNT(CASE WHEN (survey_response.survey_type = 'onboarding' AND survey_response.nps_score >= 9) THEN survey_response.nps_score END) - COUNT(CASE WHEN (survey_response.survey_type = 'onboarding' AND survey_response.nps_score <= 6) THEN survey_response.nps_score END)) AS DECIMAL) / NULLIF(COUNT(CASE WHEN survey_response.survey_type = 'onboarding' THEN survey_response.nps_score END), 0)) * 100)
    description: Onboarding NPS. Net Promoter Score specifically for onboarding experience.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/onboarding/onboarding-nps."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"onboarding_nps\",\"gasp_version\":\"1\",\"unit\":\"score\",\"formula\":\"(count(field.nps_score where field.survey_type = 'onboarding' and field.nps_score >= 9) - count(field.nps_score where field.survey_type = 'onboarding' and field.nps_score <= 6)) / count(field.nps_score where field.survey_type = 'onboarding') * 100\"}"
  - name: gasp_onboardings_per_resource
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_onboardings_per_resource.value)
    description: Onboardings per Resource. Number of onboardings handled per implementation resource.
