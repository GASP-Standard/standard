        data: '{"gasp_id":"projects_per_consultant","gasp_version":"1","unit":"ratio","formula":"count_distinct(field.project_id where in_period(field.project_completion_date)) / count_distinct(field.consultant_id where in_period(field.project_completion_date))","staged":true}'
  - name: gasp_average_project_duration
