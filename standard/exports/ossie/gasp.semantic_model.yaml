      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/people/total-headcount. Broken down by department: report one value per department by grouping on the department field of each dataset the expression reads. Reads the employee snapshot: select one snapshot date (the period end) with the time dimension, since summing snapshot rows across dates double counts."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"total_headcount\",\"gasp_version\":\"1\",\"variant\":\"by_department\",\"unit\":\"count\",\"formula\":\"count_distinct(field.employee_id where field.employee_status = 'active') at period_end\",\"gasp_breakdown\":\"department\"}"
  - name: gasp_headcount_growth_rate
