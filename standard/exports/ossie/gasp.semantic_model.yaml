        data: '{"gasp_id":"partner_revenue_growth","gasp_version":"1","unit":"percent","formula":"(metric.partner_sourced_revenue - lag(metric.partner_sourced_revenue, 1 year)) / lag(metric.partner_sourced_revenue, 1 year)","staged":true}'
  - name: gasp_average_partner_revenue
