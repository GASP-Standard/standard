      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/onboarding/cost-per-onboarding. Staged (period bound in filter): gasp_staged_gasp_cost_per_onboarding holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
