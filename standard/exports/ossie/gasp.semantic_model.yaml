    description: Incident Count, by_incident_type breakdown. Number of incidents in a period.
    datatype: Integer
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/engineering/incident-count. Broken down by incident_type: report one value per incident_type by grouping on the incident_type field of each dataset the expression reads."
    custom_extensions:
