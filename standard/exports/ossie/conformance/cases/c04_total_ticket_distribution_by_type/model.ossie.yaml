        datatype: Boolean
      - name: ticket_id
        expression:
          sql: ticket_id
        description: Ticket identifier
        datatype: String
      - name: ticket_status
        expression:
          sql: ticket_status
        description: Ticket status
        datatype: String
        ai_context:
          instructions: One of open, pending, resolved, closed
      - name: ticket_type
        expression:
          sql: ticket_type
        description: Ticket category the agent or the help desk assigns
        datatype: String
        ai_context:
          instructions: One of how_to, bug, billing, account, feature_request, other
    nonportable_extensions:
      - vendor_name: GASP
        data:
          kind: event
  - name: gasp_staged_gasp_ticket_distribution_by_type
    source: SELECT p.period_start, p.period_end, _d.ticket_type AS ticket_type, ((CAST((SELECT COUNT(DISTINCT ticket_id) FROM gasp.ticket WHERE created_at >= p.period_start AND created_at < (p.period_end + INTERVAL '1 day') AND ticket_type = _d.ticket_type) AS DOUBLE PRECISION) / NULLIF(((SELECT COUNT(DISTINCT ticket_id) FROM gasp.ticket WHERE created_at >= p.period_start AND created_at < (p.period_end + INTERVAL '1 day'))), 0))) AS value FROM gasp.period_spine p CROSS JOIN (SELECT 'how_to' AS ticket_type UNION ALL SELECT 'bug' AS ticket_type UNION ALL SELECT 'billing' AS ticket_type UNION ALL SELECT 'account' AS ticket_type UNION ALL SELECT 'feature_request' AS ticket_type UNION ALL SELECT 'other' AS ticket_type) _d
    description: "Staged dataset for gasp_ticket_distribution_by_type: one row per reporting period and ticket_type value holding the metric value, computed by the GASP compiled query (needs total)."
    primary_key:
      - period_start
      - ticket_type
    fields:
      - name: period_start
        expression:
          sql: period_start
        dimension:
          is_time: true
        datatype: Date
        description: First day of the reporting period
      - name: period_end
        expression:
          sql: period_end
        datatype: Date
        description: Last day of the reporting period
      - name: ticket_type
        expression:
          sql: ticket_type
        datatype: String
        description: Ticket category the agent or the help desk assigns
      - name: value
        expression:
          sql: value
        datatype: Decimal
        description: Ticket Distribution by Type for the period and ticket_type
    nonportable_extensions:
      - vendor_name: GASP
        data:
          staged: true
          for: gasp_ticket_distribution_by_type
          reason: total
          source_dialect: POSTGRES
          sources:
            SNOWFLAKE: SELECT p.period_start, p.period_end, _d.ticket_type AS ticket_type, ((CAST((SELECT COUNT(DISTINCT ticket_id) FROM gasp.ticket WHERE created_at >= p.period_start AND created_at < DATEADD(day, 1, p.period_end) AND ticket_type = _d.ticket_type) AS DOUBLE) / NULLIF(((SELECT COUNT(DISTINCT ticket_id) FROM gasp.ticket WHERE created_at >= p.period_start AND created_at < DATEADD(day, 1, p.period_end))), 0))) AS value FROM gasp.period_spine p CROSS JOIN (SELECT 'how_to' AS ticket_type UNION ALL SELECT 'bug' AS ticket_type UNION ALL SELECT 'billing' AS ticket_type UNION ALL SELECT 'account' AS ticket_type UNION ALL SELECT 'feature_request' AS ticket_type UNION ALL SELECT 'other' AS ticket_type) _d
            BIGQUERY: SELECT p.period_start, p.period_end, _d.ticket_type AS ticket_type, ((CAST((SELECT COUNT(DISTINCT ticket_id) FROM gasp.ticket WHERE created_at >= TIMESTAMP(p.period_start) AND created_at < TIMESTAMP(DATE_ADD(p.period_end, INTERVAL 1 DAY)) AND ticket_type = _d.ticket_type) AS FLOAT64) / NULLIF(((SELECT COUNT(DISTINCT ticket_id) FROM gasp.ticket WHERE created_at >= TIMESTAMP(p.period_start) AND created_at < TIMESTAMP(DATE_ADD(p.period_end, INTERVAL 1 DAY)))), 0))) AS value FROM gasp.period_spine p CROSS JOIN (SELECT 'how_to' AS ticket_type UNION ALL SELECT 'bug' AS ticket_type UNION ALL SELECT 'billing' AS ticket_type UNION ALL SELECT 'account' AS ticket_type UNION ALL SELECT 'feature_request' AS ticket_type UNION ALL SELECT 'other' AS ticket_type) _d
            DATABRICKS: SELECT p.period_start, p.period_end, _d.ticket_type AS ticket_type, ((CAST((SELECT COUNT(DISTINCT ticket_id) FROM gasp.ticket WHERE created_at >= p.period_start AND created_at < DATEADD(DAY, 1, p.period_end) AND ticket_type = _d.ticket_type) AS DOUBLE) / NULLIF(((SELECT COUNT(DISTINCT ticket_id) FROM gasp.ticket WHERE created_at >= p.period_start AND created_at < DATEADD(DAY, 1, p.period_end))), 0))) AS value FROM gasp.period_spine p CROSS JOIN (SELECT 'how_to' AS ticket_type UNION ALL SELECT 'bug' AS ticket_type UNION ALL SELECT 'billing' AS ticket_type UNION ALL SELECT 'account' AS ticket_type UNION ALL SELECT 'feature_request' AS ticket_type UNION ALL SELECT 'other' AS ticket_type) _d
metrics:
  - name: gasp_ticket_distribution_by_type
    expression:
      sql: SUM(gasp_staged_gasp_ticket_distribution_by_type.value)
    description: Ticket Distribution by Type. Breakdown of tickets by category.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://koinedata.com/v1/metrics/support/ticket-distribution-by-type. Broken down by ticket_type: report one value per ticket_type. Staged (total): gasp_staged_gasp_ticket_distribution_by_type holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    nonportable_extensions:
      - vendor_name: GASP
        data:
          gasp_id: ticket_distribution_by_type
          gasp_version: "1"
          unit: percent
          formula: count_distinct(field.ticket_id) / total(metric.ticket_volume)
          gasp_breakdown: ticket_type
          staged: true
