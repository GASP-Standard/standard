version: 0.3.0.dev0
name: gasp_conformance_c04_total_ticket_distribution_by_type
description: 'GASP conformance case c04_total_ticket_distribution_by_type: a share of the ungrouped total inside a breakdown. The metric gasp_ticket_distribution_by_type is staged because its formula needs "total", which OSSIE_SQL_2026 cannot state; its staged dataset carries the compiled SQL. Formula: count_distinct(field.ticket_id) / total(metric.ticket_volume)'
ai_context:
  instructions: Evaluate gasp_ticket_distribution_by_type for the period 2026-01-01 to 2026-06-30 (one row of gasp.period_spine) over the tables in ../../data/ and compare with expected.sql.
datasets:
