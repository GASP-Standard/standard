# Generated from the GASP Standard (https://gaspwiki.com) by `npm run derive` in gasp-wiki-mcp. Do not edit; edit /standard/ and re-run.
version: 0.2.0.dev0
name: gasp_conformance_c09_window_dau_mau
description: 'GASP conformance case c09_window_dau_mau: trailing windows of different lengths ending at the period end (one day over thirty). The metric gasp_dau_mau is staged because its formula needs "window", which OSSIE_SQL_2026 cannot state; its staged dataset carries the compiled SQL. Formula: metric.daily_active_users_dau / metric.monthly_active_users_mau'
ai_context:
  instructions: Evaluate gasp_dau_mau for the period 2026-01-01 to 2026-06-30 (one row of gasp.period_spine) over the tables in ../../data/ and compare with expected.sql.
datasets:
  - name: product_event
    source: gasp.product_event
    description: "Product usage event. Kind: event."
    primary_key:
      - event_id
    fields:
      - name: customer_id
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: customer_id
        description: Customer (account) identifier. Primary business noun; CEL name
        datatype: String
      - name: event_date
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: event_date
        dimension:
          is_time: true
        description: Date the event occurred
        datatype: Date
      - name: event_id
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: event_id
        description: Unique, immutable event identifier
        datatype: String
      - name: feature_id
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: feature_id
        description: Feature identifier
        datatype: String
      - name: product_event_type
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: product_event_type
        description: Kind of product event; qualifying events define active use
        datatype: String
        ai_context:
          instructions: One of qualifying, action, error, reactivation, login
      - name: session_duration
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: session_duration
        description: Session length in minutes
        datatype: Integer
      - name: session_id
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: session_id
        description: Session identifier
        datatype: String
      - name: signup_date
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: signup_date
        description: User signup date
        datatype: Date
      - name: usage_count
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: usage_count
        description: Actions in the event or session
        datatype: Integer
      - name: user_id
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: user_id
        description: Product user identifier
        datatype: String
    custom_extensions:
      - vendor_name: GASP
        data: '{"kind":"event"}'
  - name: gasp_staged_gasp_dau_mau
    source: SELECT p.period_start, p.period_end, ((CAST(((SELECT COUNT(DISTINCT user_id) FROM gasp.product_event WHERE event_date > (p.period_end - INTERVAL '1 day') AND event_date <= p.period_end AND product_event_type = 'qualifying')) AS DOUBLE PRECISION) / NULLIF(((SELECT COUNT(DISTINCT user_id) FROM gasp.product_event WHERE event_date > (p.period_end - INTERVAL '30 day') AND event_date <= p.period_end AND product_event_type = 'qualifying')), 0))) AS value FROM gasp.period_spine p
    description: "Staged dataset for gasp_dau_mau: one row per reporting period holding the metric value, computed by the GASP compiled query (needs window)."
    primary_key:
      - period_start
    fields:
      - name: period_start
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: period_start
        dimension:
          is_time: true
        datatype: Date
        description: First day of the reporting period
      - name: period_end
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: period_end
        datatype: Date
        description: Last day of the reporting period
      - name: value
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: value
        datatype: Decimal
        description: DAU/MAU Ratio (Stickiness) for the period
    custom_extensions:
      - vendor_name: GASP
        data: "{\"staged\":true,\"for\":\"gasp_dau_mau\",\"reason\":\"window\",\"source_dialect\":\"POSTGRES\",\"sources\":{\"SNOWFLAKE\":\"SELECT p.period_start, p.period_end, ((CAST(((SELECT COUNT(DISTINCT user_id) FROM gasp.product_event WHERE event_date > DATEADD(day, -1, p.period_end) AND event_date <= p.period_end AND product_event_type = 'qualifying')) AS DOUBLE) / NULLIF(((SELECT COUNT(DISTINCT user_id) FROM gasp.product_event WHERE event_date > DATEADD(day, -30, p.period_end) AND event_date <= p.period_end AND product_event_type = 'qualifying')), 0))) AS value FROM gasp.period_spine p\",\"BIGQUERY\":\"SELECT p.period_start, p.period_end, ((CAST(((SELECT COUNT(DISTINCT user_id) FROM gasp.product_event WHERE event_date > DATE_SUB(p.period_end, INTERVAL 1 DAY) AND event_date <= p.period_end AND product_event_type = 'qualifying')) AS FLOAT64) / NULLIF(((SELECT COUNT(DISTINCT user_id) FROM gasp.product_event WHERE event_date > DATE_SUB(p.period_end, INTERVAL 30 DAY) AND event_date <= p.period_end AND product_event_type = 'qualifying')), 0))) AS value FROM gasp.period_spine p\",\"DATABRICKS\":\"SELECT p.period_start, p.period_end, ((CAST(((SELECT COUNT(DISTINCT user_id) FROM gasp.product_event WHERE event_date > DATEADD(DAY, -1, p.period_end) AND event_date <= p.period_end AND product_event_type = 'qualifying')) AS DOUBLE) / NULLIF(((SELECT COUNT(DISTINCT user_id) FROM gasp.product_event WHERE event_date > DATEADD(DAY, -30, p.period_end) AND event_date <= p.period_end AND product_event_type = 'qualifying')), 0))) AS value FROM gasp.period_spine p\"}}"
metrics:
  - name: gasp_dau_mau
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_dau_mau.value)
    description: DAU/MAU Ratio (Stickiness). The ratio of daily to monthly active users, indicating how often users return.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/daumau-ratio-stickiness. Staged (window): gasp_staged_gasp_dau_mau holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"dau_mau","gasp_version":"1","unit":"percent","formula":"metric.daily_active_users_dau / metric.monthly_active_users_mau","staged":true}'
