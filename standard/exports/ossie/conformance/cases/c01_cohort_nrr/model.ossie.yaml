# Generated from the GASP Standard (https://gaspwiki.com) by `npm run derive` in gasp-wiki-mcp. Do not edit; edit /standard/ and re-run.
version: 0.2.0.dev0
name: gasp_conformance_c01_cohort_nrr
description: 'GASP conformance case c01_cohort_nrr: a cohort fixed at the opening of the period and followed through its events (Net Revenue Retention). The metric gasp_nrr is staged because its formula needs "cohort", which OSSIE_SQL_2026 cannot state; its staged dataset carries the compiled SQL. Formula: (metric.mrr at period_start + metric.expansion_mrr - metric.contraction_mrr - metric.churned_mrr) / metric.mrr at period_start over cohort(field.customer_id, period_start)'
ai_context:
  instructions: Evaluate gasp_nrr for the period 2026-01-01 to 2026-06-30 (one row of gasp.period_spine) over the tables in ../../data/ and compare with expected.sql.
datasets:
  - name: revenue_event
    source: gasp.revenue_event
    description: "Revenue event. Kind: event. CEL class: Revenue_Event."
    primary_key:
      - event_id
    fields:
      - name: change_nature
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: change_nature
        description: permanent, temporary or scheduled_reversal (Adjusted NRR/GRR)
        datatype: String
        ai_context:
          instructions: One of permanent, temporary, scheduled_reversal
      - name: currency
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: currency
        description: ISO 4217 currency code
        datatype: String
      - name: customer_id
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: customer_id
        description: Customer (account) identifier. Primary business noun; CEL name
        datatype: String
      - name: event_date
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: event_date
        dimension:
          is_time: true
        description: Date the event occurred
        datatype: Date
      - name: event_id
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: event_id
        description: Unique, immutable event identifier
        datatype: String
      - name: event_type
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: event_type
        description: Revenue movement classifier (CEL Revenue_Event.event_type)
        datatype: String
        ai_context:
          instructions: One of new, expansion, contraction, churn, reactivation, renewal
      - name: expansion_classification
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: expansion_classification
        description: ATL expansion tag; required for NRR-M and ARR-M
        datatype: String
        ai_context:
          instructions: One of same_product, new_module, new_buying_centre, pricing_adjustment, recontracting, usage_realisation
      - name: lifecycle_attribution
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: lifecycle_attribution
        description: ATL lifecycle tag
        datatype: String
        ai_context:
          instructions: One of acquisition, activation, retention, expansion, reactivation, servicing
      - name: mrr_change
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: mrr_change
        description: Change in MRR; negative for contraction and churn
        datatype: Decimal
      - name: new_mrr
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: new_mrr
        description: MRR after the event
        datatype: Decimal
      - name: prior_mrr
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: prior_mrr
        description: MRR before the event
        datatype: Decimal
      - name: segment
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: segment
        description: Customer segment (SMB, Mid-Market, Enterprise or the organisation's own scheme) at the time of the event or snapshot. The field behind the Segment concept; carried on revenue tables so retention and movement metrics slice by it without a join.
        datatype: String
      - name: subscription_id
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: subscription_id
        description: Subscription identifier
        datatype: String
    custom_extensions:
      - vendor_name: GASP
        data: '{"kind":"event","cel":"Revenue_Event"}'
  - name: customer
