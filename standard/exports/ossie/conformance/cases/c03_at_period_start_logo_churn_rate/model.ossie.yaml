version: 0.2.0.dev0
name: gasp_conformance_c03_at_period_start_logo_churn_rate
description: 'GASP conformance case c03_at_period_start_logo_churn_rate: a snapshot read at the opening of the period beside events inside it. The metric gasp_logo_churn_rate is staged because its formula needs "at period_start", which OSSIE_SQL_2026 cannot state; its staged dataset carries the compiled SQL. Formula: metric.churned_customers / metric.total_customers at period_start'
ai_context:
  instructions: Evaluate gasp_logo_churn_rate for the period 2026-01-01 to 2026-06-30 (one row of gasp.period_spine) over the tables in ../../data/ and compare with expected.sql.
