            - dialect: OSSIE_SQL_2026
              expression: change_nature
        description: permanent, temporary or scheduled_reversal (Adjusted NRR/GRR)
        datatype: String
        ai_context:
          instructions: One of permanent, temporary, scheduled_reversal
      - name: currency
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: currency
        description: ISO 4217 currency code
        datatype: String
      - name: customer_id
