# Generated from the GASP Standard (https://gaspwiki.com) by `npm run derive` in gasp-wiki-mcp. Do not edit; edit /standard/ and re-run.
version: 0.2.0.dev0
name: gasp_conformance_c10_distinct_pair_breadth_of_adoption
description: 'GASP conformance case c10_distinct_pair_breadth_of_adoption: a count of distinct tuples (account and feature pairs). The metric gasp_breadth_of_adoption is staged because its formula needs "distinct pair", which OSSIE_SQL_2026 cannot state; its staged dataset carries the compiled SQL. Formula: count_distinct(field.customer_id, field.feature_id) / metric.active_accounts'
ai_context:
  instructions: Evaluate gasp_breadth_of_adoption for the period 2026-01-01 to 2026-06-30 (one row of gasp.period_spine) over the tables in ../../data/ and compare with expected.sql.
datasets:
  - name: product_event
    source: gasp.product_event
    description: "Product usage event. Kind: event."
    primary_key:
      - event_id
    fields:
      - name: customer_id
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: customer_id
        description: Customer (account) identifier. Primary business noun; CEL name
        datatype: String
      - name: event_date
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: event_date
        dimension:
          is_time: true
        description: Date the event occurred
        datatype: Date
      - name: event_id
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: event_id
        description: Unique, immutable event identifier
        datatype: String
      - name: feature_id
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: feature_id
        description: Feature identifier
        datatype: String
      - name: product_event_type
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: product_event_type
        description: Kind of product event; qualifying events define active use
        datatype: String
        ai_context:
          instructions: One of qualifying, action, error, reactivation, login
      - name: session_duration
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: session_duration
        description: Session length in minutes
        datatype: Integer
      - name: session_id
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: session_id
        description: Session identifier
        datatype: String
      - name: signup_date
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: signup_date
        description: User signup date
        datatype: Date
      - name: usage_count
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: usage_count
        description: Actions in the event or session
        datatype: Integer
      - name: user_id
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: user_id
        description: Product user identifier
        datatype: String
    custom_extensions:
      - vendor_name: GASP
        data: '{"kind":"event"}'
  - name: gasp_staged_gasp_breadth_of_adoption
    source: SELECT p.period_start, p.period_end, ((CAST((SELECT COUNT(*) FROM (SELECT DISTINCT customer_id, feature_id FROM gasp.product_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND customer_id IS NOT NULL AND feature_id IS NOT NULL) _pairs) AS DOUBLE PRECISION) / NULLIF(((SELECT COUNT(DISTINCT customer_id) FROM gasp.product_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND product_event_type = 'qualifying')), 0))) AS value FROM gasp.period_spine p
    description: "Staged dataset for gasp_breadth_of_adoption: one row per reporting period holding the metric value, computed by the GASP compiled query (needs distinct pair)."
    primary_key:
      - period_start
    fields:
      - name: period_start
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: period_start
        dimension:
          is_time: true
        datatype: Date
        description: First day of the reporting period
      - name: period_end
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: period_end
        datatype: Date
        description: Last day of the reporting period
      - name: value
        expression:
          dialects:
            - dialect: OSSIE_SQL_2026
              expression: value
        datatype: Decimal
        description: Breadth of Adoption for the period
    custom_extensions:
      - vendor_name: GASP
        data: "{\"staged\":true,\"for\":\"gasp_breadth_of_adoption\",\"reason\":\"distinct pair\",\"source_dialect\":\"POSTGRES\",\"sources\":{\"SNOWFLAKE\":\"SELECT p.period_start, p.period_end, ((CAST((SELECT COUNT(*) FROM (SELECT DISTINCT customer_id, feature_id FROM gasp.product_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND customer_id IS NOT NULL AND feature_id IS NOT NULL) _pairs) AS DOUBLE) / NULLIF(((SELECT COUNT(DISTINCT customer_id) FROM gasp.product_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND product_event_type = 'qualifying')), 0))) AS value FROM gasp.period_spine p\",\"BIGQUERY\":\"SELECT p.period_start, p.period_end, ((CAST((SELECT COUNT(*) FROM (SELECT DISTINCT customer_id, feature_id FROM gasp.product_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND customer_id IS NOT NULL AND feature_id IS NOT NULL) _pairs) AS FLOAT64) / NULLIF(((SELECT COUNT(DISTINCT customer_id) FROM gasp.product_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND product_event_type = 'qualifying')), 0))) AS value FROM gasp.period_spine p\",\"DATABRICKS\":\"SELECT p.period_start, p.period_end, ((CAST((SELECT COUNT(*) FROM (SELECT DISTINCT customer_id, feature_id FROM gasp.product_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND customer_id IS NOT NULL AND feature_id IS NOT NULL) _pairs) AS DOUBLE) / NULLIF(((SELECT COUNT(DISTINCT customer_id) FROM gasp.product_event WHERE event_date >= p.period_start AND event_date <= p.period_end AND product_event_type = 'qualifying')), 0))) AS value FROM gasp.period_spine p\"}}"
metrics:
  - name: gasp_breadth_of_adoption
    expression:
      dialects:
        - dialect: OSSIE_SQL_2026
          expression: SUM(gasp_staged_gasp_breadth_of_adoption.value)
    description: Breadth of Adoption. Average number of features used per account.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/breadth-of-adoption. Staged (distinct pair): gasp_staged_gasp_breadth_of_adoption holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: '{"gasp_id":"breadth_of_adoption","gasp_version":"1","unit":"ratio","formula":"count_distinct(field.customer_id, field.feature_id) / metric.active_accounts","staged":true}'
