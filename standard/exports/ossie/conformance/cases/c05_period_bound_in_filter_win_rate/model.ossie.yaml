        description: "Marketing channel: the channel a campaign runs in, and the first-touch channel of an opportunity"
        datatype: String
        ai_context:
          instructions: One of paid_ads, organic_search, email, events, content, referral, marketplace, direct, other
      - name: close_date
        expression:
          sql: close_date
        description: Actual or expected close date of the opportunity; on a project or registration, the close date of the won deal
        datatype: Date
      - name: close_date_valid
