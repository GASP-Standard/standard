# Generated from the GASP Standard (https://koinedata.com) by `npm run derive` in gasp-wiki-mcp. Do not edit; edit /standard/ and re-run.
version: 0.2.0.dev0
name: gasp_conformance_c05_period_bound_in_filter_win_rate
description: "GASP conformance case c05_period_bound_in_filter_win_rate: the reporting period bound to a field other than the dataset's time field (opportunities by close date on a snapshot). The metric gasp_win_rate is staged because its formula needs \"period bound in filter\", which OSSIE_SQL_2026 cannot state; its staged dataset carries the compiled SQL. Formula: count(field.opportunity_id where field.opportunity_stage = 'closed_won' and in_period(field.close_date)) / count(field.opportunity_id where field.opportunity_stage in ('closed_won', 'closed_lost') and in_period(field.close_date))"
ai_context:
  instructions: Evaluate gasp_win_rate for the period 2026-01-01 to 2026-06-30 (one row of gasp.period_spine) over the tables in ../../data/ and compare with expected.sql.
datasets:
  - name: opportunity
    source: gasp.opportunity
    description: "Opportunity. Kind: snapshot."
    primary_key:
      - opportunity_id
      - snapshot_date
    fields:
      - name: advanced_to_next_stage
        expression:
          sql: advanced_to_next_stage
        description: Advanced one stage in the period
        datatype: Boolean
      - name: channel
        expression:
