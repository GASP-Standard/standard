        description: Forecast category
        datatype: String
        ai_context:
          instructions: One of pipeline, best_case, commit, closed
      - name: includes_services
        expression:
          sql: includes_services
        description: Deal includes professional services
        datatype: Boolean
      - name: lead_id
        expression:
