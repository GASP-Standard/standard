        datatype: Boolean
      - name: marketing_source
        expression:
          sql: marketing_source
        description: Team that sourced the opportunity
        datatype: String
        ai_context:
          instructions: One of marketing, sales, partner, other
      - name: opportunity_amount
        expression:
          sql: opportunity_amount
        description: Opportunity value (recurring)
        datatype: Decimal
      - name: opportunity_created_date
        expression:
          sql: opportunity_created_date
        description: Date the opportunity was created
        datatype: Date
      - name: opportunity_id
        expression:
          sql: opportunity_id
        description: Opportunity (deal) identifier
        datatype: String
      - name: opportunity_stage
        expression:
          sql: opportunity_stage
        description: Sales stage of an opportunity, or of a partner's registered deal
        datatype: String
        ai_context:
          instructions: One of qualification, discovery, proposal, negotiation, closed_won, closed_lost
      - name: partner_id
        expression:
          sql: partner_id
        description: Partner identifier
        datatype: String
      - name: partner_sourced
