        datatype: Boolean
      - name: revenue_type
        expression:
          sql: revenue_type
        description: Revenue line type
        datatype: String
        ai_context:
          instructions: One of subscription, services, usage, other
      - name: snapshot_date
        expression:
          sql: snapshot_date
        dimension:
          is_time: true
        description: As-of date of the snapshot row
        datatype: Date
      - name: stage_accurate
        expression:
          sql: stage_accurate
        description: Stage matches observed activity
        datatype: Boolean
      - name: stage_probability
