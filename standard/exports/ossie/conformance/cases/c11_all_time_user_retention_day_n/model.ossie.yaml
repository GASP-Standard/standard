# Generated from the GASP Standard (https://gaspwiki.com) by `npm run derive` in gasp-wiki-mcp. Do not edit; edit /standard/ and re-run.
version: 0.2.0.dev0
name: gasp_conformance_c11_all_time_user_retention_day_n
description: "GASP conformance case c11_all_time_user_retention_day_n: an unbounded range beside a bounded one (users who signed up in the period, active any time after). The metric gasp_user_retention_day_n is staged because its formula needs \"all_time\", which OSSIE_SQL_2026 cannot state; its staged dataset carries the compiled SQL. Formula: all_time(count_distinct(field.user_id where field.product_event_type = 'qualifying' and in_period(field.signup_date) and (field.event_date - field.signup_date) = 30)) / count_distinct(field.user_id where in_period(field.signup_date))"
ai_context:
  instructions: Evaluate gasp_user_retention_day_n for the period 2026-01-01 to 2026-06-30 (one row of gasp.period_spine) over the tables in ../../data/ and compare with expected.sql.
datasets:
  - name: user
    source: gasp.user
    description: "User. Kind: snapshot."
    primary_key:
      - user_id
      - snapshot_date
    fields:
      - name: activation_date
        expression:
          sql: activation_date
        description: Date the activation milestone was reached
        datatype: Date
      - name: core_features_adopted
        expression:
