  - name: gasp_staged_gasp_user_retention_day_n
    source: SELECT p.period_start, p.period_end, ((CAST((SELECT COUNT(DISTINCT user_id) FROM gasp.product_event WHERE ((product_event_type = 'qualifying' AND (signup_date >= p.period_start AND signup_date <= p.period_end)) AND (event_date - signup_date) = 30)) AS DOUBLE PRECISION) / NULLIF((SELECT COUNT(DISTINCT user_id) FROM gasp.user WHERE snapshot_date = p.period_end AND (signup_date >= p.period_start AND signup_date <= p.period_end)), 0))) AS value FROM gasp.period_spine p
    description: "Staged dataset for gasp_user_retention_day_n: one row per reporting period holding the metric value, computed by the GASP compiled query (needs all_time, period bound in filter)."
    primary_key:
      - period_start
    fields:
      - name: period_start
        expression:
          sql: period_start
        dimension:
          is_time: true
        datatype: Date
        description: First day of the reporting period
      - name: period_end
        expression:
          sql: period_end
        datatype: Date
        description: Last day of the reporting period
      - name: value
        expression:
          sql: value
        datatype: Decimal
        description: User Retention (Day N) for the period
    custom_extensions:
      - vendor_name: GASP
        data: "{\"staged\":true,\"for\":\"gasp_user_retention_day_n\",\"reason\":\"all_time\",\"source_dialect\":\"POSTGRES\",\"sources\":{\"SNOWFLAKE\":\"SELECT p.period_start, p.period_end, ((CAST((SELECT COUNT(DISTINCT user_id) FROM gasp.product_event WHERE ((product_event_type = 'qualifying' AND (signup_date >= p.period_start AND signup_date <= p.period_end)) AND DATEDIFF(day, signup_date, event_date) = 30)) AS DOUBLE) / NULLIF((SELECT COUNT(DISTINCT user_id) FROM gasp.user WHERE snapshot_date = p.period_end AND (signup_date >= p.period_start AND signup_date <= p.period_end)), 0))) AS value FROM gasp.period_spine p\",\"BIGQUERY\":\"SELECT p.period_start, p.period_end, ((CAST((SELECT COUNT(DISTINCT user_id) FROM gasp.product_event WHERE ((product_event_type = 'qualifying' AND (signup_date >= p.period_start AND signup_date <= p.period_end)) AND DATE_DIFF(event_date, signup_date, DAY) = 30)) AS FLOAT64) / NULLIF((SELECT COUNT(DISTINCT user_id) FROM gasp.user WHERE snapshot_date = p.period_end AND (signup_date >= p.period_start AND signup_date <= p.period_end)), 0))) AS value FROM gasp.period_spine p\",\"DATABRICKS\":\"SELECT p.period_start, p.period_end, ((CAST((SELECT COUNT(DISTINCT user_id) FROM gasp.product_event WHERE ((product_event_type = 'qualifying' AND (signup_date >= p.period_start AND signup_date <= p.period_end)) AND DATEDIFF(event_date, signup_date) = 30)) AS DOUBLE) / NULLIF((SELECT COUNT(DISTINCT user_id) FROM gasp.user WHERE snapshot_date = p.period_end AND (signup_date >= p.period_start AND signup_date <= p.period_end)), 0))) AS value FROM gasp.period_spine p\"}}"
metrics:
  - name: gasp_user_retention_day_n
    expression:
      sql: SUM(gasp_staged_gasp_user_retention_day_n.value)
    description: User Retention (Day N). Percentage of users who return on day N after signup.
    datatype: Decimal
    ai_context:
      instructions: "Canonical definition: https://gaspwiki.com/v1/metrics/product/user-retention-day-n. Staged (all_time): gasp_staged_gasp_user_retention_day_n holds one row per reporting period, so filter its period_start to one period. gasp.period_spine is a table of (period_start, period_end) rows the adopter provides."
    custom_extensions:
      - vendor_name: GASP
        data: "{\"gasp_id\":\"user_retention_day_n\",\"gasp_version\":\"1\",\"unit\":\"percent\",\"formula\":\"all_time(count_distinct(field.user_id where field.product_event_type = 'qualifying' and in_period(field.signup_date) and (field.event_date - field.signup_date) = 30)) / count_distinct(field.user_id where in_period(field.signup_date))\",\"staged\":true}"
