        description: Product user identifier
        datatype: String
      - name: user_status
        expression:
          sql: user_status
        description: User activity status
        datatype: String
        ai_context:
          instructions: One of active, dormant, deactivated
    custom_extensions:
      - vendor_name: GASP
        data: "{\"kind\":\"snapshot\",\"activeWhen\":\"field.user_status = 'active'\"}"
  - name: product_event
    source: gasp.product_event
    description: "Product usage event. Kind: event."
    primary_key:
      - event_id
    fields:
      - name: customer_id
        expression:
          sql: customer_id
        description: Customer (account) identifier. Primary business noun; CEL name
        datatype: String
      - name: event_date
        expression:
          sql: event_date
        dimension:
          is_time: true
        description: Date the event occurred
        datatype: Date
      - name: event_id
