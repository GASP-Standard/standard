version: 0.3.0.dev0
name: gasp_conformance_c02_lag_mrr_growth_rate
description: 'GASP conformance case c02_lag_mrr_growth_rate: the same aggregate one period earlier (period-over-period growth). The metric gasp_mrr_growth_rate is staged because its formula needs "lag", which OSSIE_SQL_2026 cannot state; its staged dataset carries the compiled SQL. Formula: (metric.mrr - lag(metric.mrr, 1 month)) / lag(metric.mrr, 1 month)'
ai_context:
  instructions: Evaluate gasp_mrr_growth_rate for the period 2026-01-01 to 2026-06-30 (one row of gasp.period_spine) over the tables in ../../data/ and compare with expected.sql.
datasets:
  - name: subscription
